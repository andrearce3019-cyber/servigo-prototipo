  --orange:#C2410C; --orange-s:#FFF1E8;
  --green:#15803D; --green-s:#E9F7EF;
  --red:#B91C1C; --red-s:#FDECEC;

:root{--page:#DDE3EC}

:root[data-theme="dark"]{--page:#0B1220}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--page);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #7CC39A;outline-offset:2px}
.shell{min-height:100%;display:flex;justify-content:center;align-items:flex-start;padding:24px 16px}
.phone{width:100%;max-width:400px;height:min(860px,calc(100vh - 48px));background:var(--bg);border-radius:32px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 30px 80px -30px rgba(15,23,42,.45),0 0 0 1px rgba(15,23,42,.06)}
@media (max-width:480px){.shell{padding:0}.phone{max-width:none;height:100vh;height:100dvh;border-radius:0;box-shadow:none}}
.top{display:flex;align-items:center;gap:6px;height:58px;padding:0 8px 0 6px;background:#fff;border-bottom:1px solid var(--line);flex-shrink:0}
.top h1{font-size:17px;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:12px;color:var(--muted);font-weight:500}
.iconbtn{width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--ink);flex-shrink:0}
.iconbtn:hover{background:var(--bg)}
.content{flex:1;overflow-y:auto;overflow-x:hidden;position:relative}
.pad{padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.h2{font-size:16px;font-weight:700;margin:0}
.small{font-size:13px;color:var(--sub)}
.tiny{font-size:12px;color:var(--muted)}
.btn{min-height:48px;border:0;border-radius:14px;padding:0 18px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue-d)}
.btn-ghost{background:#fff;color:var(--blue);border:1.5px solid #BFDCCB}
.btn-orange{background:var(--orange);color:#fff}
.btn-xmas{background:var(--xred);color:#fff}.btn-xmas:hover{background:#A50D26}
.btn-disabled{background:#CBD5E1;color:#475569}
.chip{min-height:40px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:0 14px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px}
.pill-blue{background:var(--blue-s);color:var(--blue)}
.pill-green{background:var(--green-s);color:var(--green)}
.pill-gray{background:#EEF1F5;color:#475569}
.pill-orange{background:var(--orange-s);color:var(--orange)}
.pill-red{background:#FDE8EC;color:var(--xred)}
.avatar{border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.stars{color:var(--star);letter-spacing:1px}
.nav{display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.nav button{border:0;background:transparent;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
.nav button.on{color:var(--blue)}
.demo{background:#FFF8DB;color:#6B4E00;font-size:11.5px;font-weight:600;text-align:center;padding:5px 10px;flex-shrink:0;position:relative;z-index:6}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.field input,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:#fff;font-size:15px}
.field textarea{min-height:90px;resize:vertical}
.field.err input,.field.err textarea{border-color:var(--red);background:#FFFBFB}
.field .hint{font-size:12px;color:var(--muted);margin-top:5px}
.field.err .hint{color:var(--red);font-weight:600}
.errmsg{background:var(--red-s);color:var(--red);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600}
.okmsg{background:var(--green-s);color:var(--green);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600}
.overlay{position:absolute;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-end;z-index:20}
.sheet{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:22px 18px 22px}
.toast{position:absolute;top:70px;left:16px;right:16px;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;font-size:13.5px;font-weight:600;z-index:40;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.scrollx{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.scrollx::-webkit-scrollbar{display:none}
.bubble{max-width:80%;padding:10px 12px;border-radius:16px;font-size:14px;line-height:1.4}
.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:6px}
.them{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:6px}
.meta{font-size:11px;margin-top:4px;opacity:.85;display:flex;gap:6px;justify-content:flex-end}
.steps{display:flex;gap:6px}
.steps span{flex:1;height:5px;border-radius:9px;background:#D7DEE8}
.steps span.on{background:var(--blue)}
.opt{width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px;min-height:56px}
.opt.on{border-color:var(--blue);background:var(--blue-s)}
.cat{border:1px solid var(--line);background:#fff;border-radius:16px;padding:12px 2px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:600;min-height:86px;min-width:0}
.cat span:last-child{text-align:center;line-height:1.15;overflow-wrap:anywhere;hyphens:auto}
.cat .ic{width:40px;height:40px;border-radius:12px;background:var(--blue-s);color:var(--blue);display:flex;align-items:center;justify-content:center}
.techcard{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;gap:12px}
.techcard:hover{border-color:#A9D3BA}
.dropdown{position:absolute;left:16px;right:16px;top:58px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 40px -16px rgba(15,23,42,.35);z-index:10;padding:6px;max-height:360px;overflow:auto}
.dropdown button{width:100%;text-align:left;border:0;background:transparent;border-radius:10px;padding:12px;font-size:14.5px;font-weight:600;display:flex;justify-content:space-between}
.dropdown button:hover{background:var(--bg)}
.dropdown button.on{color:var(--blue);background:var(--blue-s)}
.map{position:relative;height:300px;background:#E8EEF3;overflow:hidden}
.marker{position:absolute;transform:translate(-50%,-50%);transition:left .8s ease,top .8s ease}
.sticky-cta{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 70%,rgba(244,246,250,0));padding:14px 16px 16px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.4}
.check input{width:22px;height:22px;margin:0;accent-color:var(--blue);flex-shrink:0}

/* ---------- Buscador ---------- */
.search{position:relative}
.search input{width:100%;height:52px;border:0;border-radius:16px;padding:0 44px 0 46px;font-size:15px;background:#fff;color:var(--ink);box-shadow:0 8px 24px -14px rgba(0,0,0,.5)}
.search input::placeholder{color:#64748B}
.search .lead{position:absolute;left:14px;top:15px;color:var(--muted)}
.search .clear{position:absolute;right:4px;top:4px}
.sugg{position:absolute;left:0;right:0;top:58px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 40px -18px rgba(15,23,42,.45);z-index:15;max-height:430px;overflow:auto;padding:6px;color:var(--ink)}
.sugg .grp{font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);padding:10px 10px 4px}
.sugg button{width:100%;border:0;background:transparent;text-align:left;border-radius:12px;padding:10px;display:flex;align-items:center;gap:10px;min-height:48px}
.sugg button:hover,.sugg button.kb{background:var(--bg)}
.sugg mark{background:#FFF0B3;color:inherit;border-radius:3px;padding:0 1px}
.sugg .sic{width:34px;height:34px;border-radius:10px;background:var(--blue-s);color:var(--blue);display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* ---------- Navidad ---------- */
.hero{background:var(--night);color:#fff;position:relative;padding:8px 16px 18px;border-radius:0 0 28px 28px;overflow:visible}
.hero .tiny{color:#CFE6D8}
.garland{display:block;width:100%;height:34px;margin:0 0 2px}
.bulb{animation:twinkle 1.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.35}}
.snow{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.flake{position:absolute;top:-12px;border-radius:50%;background:#fff;animation:fall linear infinite}
.snow.soft .flake{background:#BFCDE6}
@keyframes fall{0%{transform:translate(0,-12px)}50%{transform:translate(14px,50vh)}100%{transform:translate(-6px,105vh)}}
.splash{flex:1;background:var(--night);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;position:relative;overflow:hidden}
.bounce{animation:bounce 2.4s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.script{font-family:Pacifico,cursive;font-weight:400}
.promo{background:#fff;border:1.5px solid #F3C6CE;border-radius:20px;padding:16px;position:relative;overflow:hidden}
.ribbon{position:absolute;right:-34px;top:14px;transform:rotate(35deg);background:var(--xred);color:#fff;font-size:11px;font-weight:800;padding:4px 40px}
.gift{animation:wiggle 2.8s ease-in-out infinite;transform-origin:50% 90%}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-8deg)}90%{transform:rotate(8deg)}95%{transform:rotate(-4deg)}}
.fadein{animation:fadein .5s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- Radar emergencia ---------- */
.radar{position:relative;width:240px;height:240px;margin:4px auto 0}
.radar .ring{position:absolute;inset:0;margin:auto;width:96px;height:96px;border-radius:50%;border:2px solid rgba(194,65,12,.55);animation:ring 2.4s ease-out infinite}
.radar .ring:nth-child(2){animation-delay:.8s}.radar .ring:nth-child(3){animation-delay:1.6s}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(2.5);opacity:0}}
.radar .sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(194,65,12,.22),rgba(194,65,12,0) 70deg);animation:spin 2.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.radar .grid{position:absolute;inset:0;border-radius:50%;border:1px dashed #F2B79A}
.radar .grid.g2{inset:40px}.radar .grid.g3{inset:80px}
.radar .core{position:absolute;left:50%;top:50%;width:92px;height:92px;margin:-46px 0 0 -46px;border-radius:50%;background:#fff;box-shadow:0 12px 30px -12px rgba(194,65,12,.7),inset 0 0 0 6px #FFE2D2;display:flex;align-items:center;justify-content:center}
.radar .dot{position:absolute;transform:translate(-50%,-50%);animation:pop .4s ease both}
@keyframes pop{from{transform:translate(-50%,-50%) scale(0)}to{transform:translate(-50%,-50%) scale(1)}}

/* ---------- Llamada ---------- */
.call{position:absolute;inset:0;background:#0B2E20;color:#fff;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:56px 24px 40px;text-align:center}
.call .ava{width:120px;height:120px;border-radius:50%;font-size:40px;font-weight:800;display:flex;align-items:center;justify-content:center;position:relative}
.call .ava::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid rgba(255,255,255,.35);animation:ring 1.8s ease-out infinite}
.call .ctl{width:64px;height:64px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;color:#fff;background:rgba(255,255,255,.14)}
.call .ctl.on{background:#fff;color:#0B2E20}
.call .hang{background:#DC2626}
@media (prefers-reduced-motion:reduce){.bulb,.flake,.bounce,.gift,.radar .ring,.radar .sweep,.call .ava::after{animation:none}.flake{display:none}}
</style>

const garland=()=>{const cols=['#E63946','#F4B400','#2AB673','#4C8DFF'];let b='';
 for(let i=0;i<13;i++){const x=10+i*30,y=10+Math.sin(i*0.95)*5+8;b+=`<line x1="${x}" y1="${y-6}" x2="${x}" y2="${y-1}" stroke="#2F5E47" stroke-width="2"/><ellipse class="bulb" style="animation-delay:${(i%4)*0.35}s" cx="${x}" cy="${y+5}" rx="5" ry="7" fill="${cols[i%4]}"/>`}
 return `<svg class="garland" viewBox="0 0 380 34" preserveAspectRatio="none" aria-hidden="true"><path d="M0 8 Q 50 22 100 10 T 200 12 T 300 10 T 380 14" fill="none" stroke="#2F5E47" stroke-width="2"/>${b}</svg>`};
const snow=(n=26,soft=false)=>{let f='';for(let i=0;i<n;i++){const s=(2+Math.random()*4).toFixed(1);
 f+=`<span class="flake" style="left:${(Math.random()*100).toFixed(1)}%;width:${s}px;height:${s}px;opacity:${(.5+Math.random()*.5).toFixed(2)};animation-duration:${(7+Math.random()*8).toFixed(1)}s;animation-delay:-${(Math.random()*12).toFixed(1)}s"></span>`}
 return `<div class="snow ${soft?'soft':''}" aria-hidden="true">${f}</div>`};

function hl(text,q){const n=norm(text),i=q?n.indexOf(q):-1;if(i<0)return esc(text);return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length))}
function suggest(raw){
 const q=norm(raw.trim());const box=document.getElementById('sugg');const clr=document.getElementById('qclear');
 if(!box)return; clr.style.display=raw?'flex':'none';
 if(q.length<1){box.style.display='none';box.innerHTML='';return}
 const words=q.split(/\s+/).filter(Boolean);
 const match=str=>words.every(w=>norm(str).includes(w));
 const serv=TARIFAS.filter(t=>match(t.s+' '+t.c+' '+t.kw)).slice(0,5);
 const cats=CATS.filter(c=>match(c.k)||serv.some(s=>s.c===c.k)).slice(0,3);
 const techs=TECHS.filter(t=>match(t.name+' '+t.cat)).slice(0,3);
 let h='';
 if(serv.length)h+=`<div class="grp">Servicios y tarifas</div>`+serv.map(s=>`<button role="option" data-a="pickServ" data-s="${esc(s.s)}"><span class="sic">${ic(catIc(s.c),18)}</span><span style="flex:1;min-width:0"><b style="font-size:14px">${hl(s.s,words[0])}</b><span class="tiny" style="display:block">${s.c} · Materiales: ${s.mat?'Sí':'No'}</span></span><b style="font-size:13.5px;white-space:nowrap">S/ ${s.min}–${s.max}</b></button>`).join('');
 if(cats.length)h+=`<div class="grp">Categorías</div>`+cats.map(c=>`<button role="option" data-a="cat" data-k="${c.k}"><span class="sic">${ic(c.ic,18)}</span><span style="flex:1"><b style="font-size:14px">${hl(c.k,words[0])}</b><span class="tiny" style="display:block">${TECHS.filter(t=>t.cat===c.k).length} técnicos verificados</span></span>${ic('right',18)}</button>`).join('');
 if(techs.length)h+=`<div class="grp">Técnicos</div>`+techs.map(t=>`<button role="option" data-a="profile" data-id="${t.id}"><span class="avatar" style="width:34px;height:34px;border-radius:10px;background:${t.bg};color:${t.fg};font-size:12px">${t.ini}</span><span style="flex:1;min-width:0"><b style="font-size:14px">${hl(t.name,words[0])}</b> ${verified(13)}<span class="tiny" style="display:block">${t.cat} · ★ ${String(t.rating).replace('.',',')}</span></span></button>`).join('');
 if(!h)h=`<div style="padding:18px 12px;text-align:center"><b style="font-size:14px">Sin resultados para “${esc(raw.trim())}”</b><div class="tiny" style="margin-top:4px">Prueba con “fuga”, “luz”, “llave” o “pintar”.</div></div>`;
 else h+=`<button data-a="searchAll" style="justify-content:center;color:var(--blue);font-weight:700;font-size:14px">Ver todos los técnicos</button>`;
 box.innerHTML=h;box.style.display='block';
}

/* ===================== RENDER ===================== */
const VIEWS={splash,register,welcome,home,list,profile,rates,chat,quote,track,rate,done,warranty,claim,emergency,me};
const app=document.getElementById('app');
function render(){
 const showNav=['home','list','rates','me'].includes(S.screen)||(S.screen==='claim'&&!S.claimCode);
 const keepDraft=document.getElementById('draft')?.value||'';
 const demo=S.screen==='splash'?'':`<div class="demo">Prototipo · datos de ejemplo</div>`;
 const cs=S.screen==='chat'?'display:flex;flex-direction:column;overflow:hidden':S.screen==='splash'?'display:flex;flex-direction:column':'';
 app.innerHTML=`${demo}${header()}<main class="content" style="${cs}">${VIEWS[S.screen]()}</main>
  ${showNav?nav():''}${S.locModal?locModal():''}${S.call?callView():''}${S.toast?`<div class="toast" role="status">${esc(S.toast)}</div>`:''}`;
 if(S.screen==='chat'){const d=document.getElementById('draft');if(d){d.value=keepDraft}const m=document.getElementById('msgs');if(m)m.scrollTop=m.scrollHeight}
}

/* ===================== CHAT ===================== */
function pushMine(m){
 S.msgs.push(Object.assign({k:'me',h:hora(),st:'Enviado'},m));S.attachErr='';render();
 if(!S.replied){S.replied=true;const t=tech();
  setTimeout(()=>{S.msgs.forEach(x=>{if(x.k==='me')x.st='Leído'});
   S.msgs.push({k:'them',t:t.cat==='Gasfitería'?'Gracias, por la foto parece la unión del tubo. Te envío mi precio con mano de obra y materiales separados.':'Gracias por la info. Ya revisé y te envío mi precio detallado.',h:hora()});
   S.msgs.push({k:'quote',h:hora()});if(S.screen==='chat')render()},1500);
 } else setTimeout(()=>{S.msgs.forEach(x=>{if(x.k==='me')x.st='Leído'});if(S.screen==='chat')render()},1200);
}
function sendDraft(){const d=document.getElementById('draft');const v=(d?.value||'').trim();if(!v)return;d.value='';pushMine({t:v})}
function openChatFor(t){if(S.chatTech!==t.id){Object.assign(S,{chatTech:t.id,replied:false,accepted:false,garantia:false,msgs:[
  {k:'sys',t:'Describe el problema y envía fotos (máx. 10 MB) o videos (máx. 30 s). El técnico te enviará su precio.'},
  {k:'them',t:`Hola ${cap(first())}, soy ${t.name.split(' ')[0]}. Cuéntame qué problema tienes y, si puedes, mándame una foto.`,h:hora()}]})}}

/* ===================== LLAMADA ===================== */
function startCall(id){clearInterval(callT);Object.assign(S,{call:id,callSec:0,muted:false,spk:false});render();
 callT=setInterval(()=>{S.callSec++;const el=document.getElementById('calltime');if(el)el.textContent=callTime()},1000)}
function endCall(){clearInterval(callT);const t=TECHS.find(x=>x.id===S.call),sec=S.callSec;S.call=null;
 if(S.chatTech===t.id&&sec>=3)S.msgs.push({k:'call',t:`Llamada de ${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')} min`});
 toast(sec>=3?`Llamada con ${t.name.split(' ')[0]} finalizada`:'Llamada cancelada')}

/* ===================== EMERGENCIA: ofertas con precio del técnico ===================== */
const OFFER_MSG={'Gasfitería':'Llevo uniones y cinta; si hay que cambiar el tubo te aviso antes.','Electricidad':'Reviso el tablero y dejo la llave cambiada si está dañada.','Cerrajería':'Abro sin dañar la puerta; si hay que cambiar el cilindro está incluido.'};
function startOffers(){offerT.forEach(clearTimeout);offerT=[];S.offers=[];
 const E=EMERG.find(e=>e.k===S.emType);const N=TECHS.filter(t=>t.cat===E.cat&&t.km<=5).sort((a,b)=>a.km-b.km);
 N.forEach((t,i)=>offerT.push(setTimeout(()=>{if(S.screen!=='emergency'||S.emStep!==3)return;S.offers.push({id:t.id,price:t.offer,eta:t.eta,msg:OFFER_MSG[t.cat]});render()},2200+i*1800)));
}

/* ===================== EVENTOS ===================== */
app.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');
 if(!b){const box=document.getElementById('sugg');if(box&&!e.target.closest('.search'))box.style.display='none';return}
 const a=b.dataset.a;
 if(a==='locBackdrop'){if(e.target===b){S.locModal=false;render()}return}
 switch(a){
  case 'back':back();break;
  case 'go':go(b.dataset.s);break;
  case 'register':{const u=S.user,err=[];
   if(u.nombre.trim().split(/\s+/).length<2)err.push('nombre');
   if(!/^\d{8}$/.test(u.dni))err.push('dni');
   if(!/^9\d{8}$/.test(u.tel))err.push('tel');
   if(!S.regTerms)err.push('terms');
   S.regErr=err;if(err.length){render();return}
   S.claim=EMPTY_CLAIM();go('welcome');break}
  case 'logout':Object.assign(S,{user:{nombre:'',dni:'',tel:''},regErr:[],regTerms:false,chatTech:null,msgs:[]});go('splash');break;
  case 'reset':Object.assign(S,{prog:0,accepted:false,garantia:false,quoteErr:'',stars:0,comment:'',rateErr:'',emergency:false,emStep:1,emType:null,emMedia:[],emNote:'',emErr:'',offers:[],emPick:null,emGar:false,wStep:1,wIssue:null,wDesc:'',wPhoto:false,claimCode:'',claimMissing:[],claim:EMPTY_CLAIM()});go('home');break;
  case 'cat':go('list',{serv:null,cat:b.dataset.k,district:'Todos'});break;
  case 'xmas':go('list',{cat:'Electricidad',district:'Todos'});toast('Instalación de luces navideñas: S/ 60 – 120');break;
  case 'pickServ':{const s=TARIFAS.find(x=>x.s===b.dataset.s);S.serv=s.s;go('list',{cat:s.c,district:'Todos'});toast(`${s.s}: S/ ${s.min} – ${s.max} (referencial)`);break}
  case 'searchAll':go('list',{cat:'Todas',district:'Todos'});break;
  case 'qclear':{const q=document.getElementById('q');q.value='';suggest('');q.focus();break}
  case 'clearCat':S.cat='Todas';render();break;
  case 'resetFilters':Object.assign(S,{cat:'Todas',district:'Todos',geo:false});render();break;
  case 'openDistrict':go('list',{});S.distOpen=true;render();break;
  case 'toggleDistrict':S.distOpen=!S.distOpen;render();break;
  case 'district':S.district=b.dataset.d;S.distOpen=false;if(S.district!=='Todos')S.geo=false;render();break;
  case 'near':if(S.geo){S.geo=false;render()}else if(S.geoAsked){S.geo=true;S.district='Todos';render()}else{S.locModal=true;render()}break;
  case 'locYes':Object.assign(S,{locModal:false,geo:true,geoAsked:true,district:'Todos',distOpen:false});toast('Mostrando técnicos a menos de 5 km');break;
  case 'locNo':Object.assign(S,{locModal:false,geo:false,distOpen:true});toast('Sin ubicación: elige tu distrito en el menú');break;
  case 'profile':go('profile',{techId:b.dataset.id,day:0,slot:null});break;
  case 'day':S.day=+b.dataset.i;render();break;
  case 'slot':S.slot=b.dataset.v;S.when='slot';toast('Horario elegido: '+S.slot);break;
  case 'sort':S.sortAsc=!S.sortAsc;render();break;
  case 'acc':{const k=b.dataset.k;S.openCats=S.openCats.includes(k)?S.openCats.filter(x=>x!==k):[...S.openCats,k];render();break}
  case 'accAll':S.openCats=S.openCats.length===CATS.length?[]:CATS.map(c=>c.k);render();break;
  case 'catsToggle':S.catsAll=!S.catsAll;render();break;
  case 'catChip':S.cat=b.dataset.k;S.serv=null;render();break;
  case 'openChat':case 'chatFromTrack':openChatFor(tech());go('chat');break;
  case 'call':startCall(b.dataset.id);break;
  case 'hang':endCall();break;
  case 'mute':S.muted=!S.muted;render();break;
  case 'spk':S.spk=!S.spk;render();break;
  case 'send':sendDraft();break;
  case 'photo':pushMine({media:'foto',t:'foto_problema.jpg · 2,4 MB'});break;
  case 'video':S.attachErr='No se pudo adjuntar "video_fuga.mp4": dura 45 s y el máximo es 30 s. Recórtalo e inténtalo de nuevo.';render();break;
  case 'clearErr':S.attachErr='';render();break;
  case 'accept':if(!S.garantia){S.quoteErr='Para aceptar la cotización primero debes aceptar la política de garantía.';render()}else{S.accepted=true;S.quoteErr='';S.price=total(tech());toast('Cotización aceptada · precio bloqueado')}break;
  case 'when':if(b.dataset.v==='slot'&&!S.slot){go('profile');toast('Elige un horario y vuelve a la cotización')}else{S.when=b.dataset.v;render()}break;
  case 'confirmVisit':go('track',{prog:0,emergency:false});break;
  case 'advance':S.prog=Math.min(4,S.prog+1);render();if(S.prog===3)toast('Tu técnico está a menos de 500 m');break;
  case 'star':S.stars=+b.dataset.i;S.rateErr='';render();break;
  case 'sendRate':S.comment=document.getElementById('comment')?.value||'';if(!S.stars){S.rateErr='Elige de 1 a 5 estrellas para enviar tu calificación.';render()}else go('done');break;
  case 'startWarranty':go('warranty',{wStep:1,wIssue:null,wDesc:'',wPhoto:false});break;
  case 'wIssue':S.wIssue=+b.dataset.i;render();break;
  case 'wPhoto':S.wDesc=document.getElementById('wdesc')?.value||S.wDesc;S.wPhoto=!S.wPhoto;render();break;
  case 'wNext':if(S.wStep===1&&S.wIssue===null)return toast('Elige un motivo para continuar');if(S.wStep===2)S.wDesc=document.getElementById('wdesc')?.value||'';S.wStep++;render();break;
  case 'wSend':S.wCode='GR-2026-'+String(Math.floor(10000+Math.random()*89999));S.wStep=4;render();break;
  case 'tipo':S.claim.tipo=b.dataset.v;render();break;
  case 'sendClaim':{const req=['nombre','dni','email','servicio','detalle','pedido'];
   S.claimMissing=req.filter(k=>!S.claim[k].trim()||(k==='dni'&&S.claim.dni.length!==8)||(k==='email'&&!/^\S+@\S+\.\S+$/.test(S.claim.email)));
   if(!S.claimMissing.length)S.claimCode='RC-2026-'+String(Math.floor(10000+Math.random()*89999));render();document.querySelector('.content').scrollTop=0;break}
  case 'startEmergency':go('emergency',{emStep:1,emType:null,emMedia:[],emNote:'',emErr:'',offers:[],emPick:null,emGar:false,emGarErr:''});break;
  case 'emType':S.emType=b.dataset.k;S.emStep=2;render();break;
  case 'emChange':S.emStep=1;render();break;
  case 'emPhoto':S.emNote=document.getElementById('emnote')?.value||S.emNote;S.emErr='';S.emMedia.push({k:'foto',n:`foto_${S.emMedia.filter(m=>m.k==='foto').length+1}.jpg · 1,8 MB`});render();break;
  case 'emVideo':S.emNote=document.getElementById('emnote')?.value||S.emNote;
   if(S.emMedia.some(m=>m.k==='video')){S.emErr='Ya adjuntaste un video. Quítalo si quieres subir otro.'}else{S.emErr='';S.emMedia.push({k:'video',n:'video_problema.mp4 · 18 s'})}render();break;
  case 'emRm':S.emMedia.splice(+b.dataset.i,1);S.emErr='';render();break;
  case 'emSend':S.emNote=document.getElementById('emnote')?.value||'';S.emStep=3;render();startOffers();break;
  case 'pickOffer':Object.assign(S,{emPick:b.dataset.id,emStep:4,emGar:false,emGarErr:''});render();document.querySelector('.content').scrollTop=0;break;
  case 'emAcceptOffer':{if(!S.emGar){S.emGarErr='Acepta la política de garantía para confirmar la oferta.';render();break}
   const o=S.offers.find(x=>x.id===S.emPick);offerT.forEach(clearTimeout);go('track',{techId:o.id,prog:1,emergency:true,price:o.price});toast(`Oferta aceptada · ${soles(o.price)} bloqueado`);break}
 }
});
app.addEventListener('input',e=>{
 const el=e.target;
 if(el.id==='q'){suggest(el.value);return}
 const r=el.dataset.r;
 if(r){let v=el.value;if(r==='dni'){v=v.replace(/\D/g,'').slice(0,8);el.value=v}if(r==='tel'){v=v.replace(/\D/g,'').slice(0,9);el.value=v}S.user[r]=v;
  if(S.regErr.includes(r)){S.regErr=S.regErr.filter(x=>x!==r);const f=el.closest('.field');f.classList.remove('err')}}
 const f=el.dataset.f;
 if(f){let v=el.value;if(f==='dni'){v=v.replace(/\D/g,'').slice(0,8);el.value=v}S.claim[f]=v;
  if(S.claimMissing.includes(f)&&v.trim()){S.claimMissing=S.claimMissing.filter(x=>x!==f);el.closest('.field').classList.remove('err')}}
 if(el.id==='comment')S.comment=el.value;
 if(el.id==='wdesc')S.wDesc=el.value;
 if(el.id==='emnote')S.emNote=el.value;
});
app.addEventListener('focusin',e=>{if(e.target.id==='q'&&e.target.value)suggest(e.target.value)});
app.addEventListener('change',e=>{
 if(e.target.id==='garantia'){S.garantia=e.target.checked;S.quoteErr='';render()}
 if(e.target.id==='emgar'){S.emGar=e.target.checked;S.emGarErr='';render()}
 if(e.target.id==='r_terms'){S.regTerms=e.target.checked;S.regErr=S.regErr.filter(x=>x!=='terms');render()}
});
app.addEventListener('keydown',e=>{
 if(e.target.id==='draft'&&e.key==='Enter'){e.preventDefault();sendDraft()}
 if(e.target.id==='q'){const box=document.getElementById('sugg');const opts=[...box.querySelectorAll('button')];if(!opts.length)return;
  let i=opts.findIndex(o=>o.classList.contains('kb'));
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();opts.forEach(o=>o.classList.remove('kb'));i=e.key==='ArrowDown'?Math.min(opts.length-1,i+1):Math.max(0,i-1);opts[i].classList.add('kb');opts[i].scrollIntoView({block:'nearest'})}
  if(e.key==='Enter'){e.preventDefault();(opts[i>=0?i:0]).click()}
  if(e.key==='Escape'){box.style.display='none'}}
});
render();
</script>
</body>
</html>
