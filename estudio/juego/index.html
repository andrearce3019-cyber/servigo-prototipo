<html lang="es">
<head>
<meta charset="utf-8">

<title>ServiGo Quest</title>

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
/* Juego tipo mapa de niveles: fondo azul noche, tarjetas brillantes, una mano */
:root{
  --bg:#14213D; --bg2:#1C2C52; --card:#FFFFFF; --ink:#14213D; --muted:#5C6B8A;
  --gold:#FFC93C; --green:#2BB673; --red:#F2545B; --blue:#4F8CFF; --violet:#9B6BFF; --orange:#FF8A3D;
  --f-game:'Baloo 2','Nunito',system-ui,sans-serif; --f-body:'Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:#fff;font-family:var(--f-body);-webkit-tap-highlight-color:transparent}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:12px}
[hidden]{display:none!important}
.wrap{max-width:520px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.brand{font-family:var(--f-game);font-weight:800;font-size:24px;line-height:1}
.brand small{display:block;font-family:var(--f-body);font-size:12px;font-weight:700;color:#AFC0E8}
.pill{background:var(--bg2);border-radius:99px;padding:7px 12px;font-weight:800;display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.pill.gold{color:var(--gold)}
.back{background:var(--bg2);width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px}
.hero{background:linear-gradient(135deg,#2BB673,#1E6B45);border-radius:22px;padding:18px;display:grid;gap:6px;margin-bottom:16px;box-shadow:0 8px 0 #154F33}
.hero h1{font-family:var(--f-game);margin:0;font-size:28px;line-height:1.05}
.hero p{margin:0;font-weight:700;opacity:.95}
.bar{height:12px;border-radius:9px;background:rgba(255,255,255,.25);overflow:hidden}.bar i{display:block;height:100%;background:var(--gold);border-radius:9px;transition:width .4s}
.map{display:grid;gap:14px;position:relative}
.lvl{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:var(--card);color:var(--ink);border-radius:20px;padding:12px;text-align:left;box-shadow:0 6px 0 rgba(0,0,0,.25);transition:transform .1s}
.lvl:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.lvl .ic{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:32px;color:#fff;font-family:var(--f-game);font-weight:800}
.lvl h3{margin:0;font-family:var(--f-game);font-size:20px;line-height:1.1}
.lvl small{color:var(--muted);font-weight:700;font-size:13px}
.stars{font-size:18px;letter-spacing:1px;white-space:nowrap}
.lvl.lock{opacity:.5;filter:grayscale(.8)}
.dl{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:start;background:var(--bg2);border:2px dashed var(--gold);border-radius:18px;padding:12px 14px;margin-bottom:14px}
.dl .e{font-size:30px;line-height:1}.dl>div>b{font-family:var(--f-game);font-size:18px;display:block}.dl p{margin:2px 0 8px;font-size:14px;color:#CFDAF5}
.dl .row{display:flex;gap:8px;align-items:center}.ib{background:var(--gold);color:#3B2600;font-weight:800;border-radius:12px;padding:9px 14px}.ix{color:#AFC0E8;font-weight:700;text-decoration:underline;padding:6px}
.tabs{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}.tabs button{background:var(--bg2);border-radius:99px;padding:9px 13px;font-weight:800;font-size:14px;color:#CFDAF5}.tabs button.on{background:var(--gold);color:#3B2600}
.tabs.sm button{font-size:13px;padding:6px 11px}
.mbtns{display:flex;flex-wrap:wrap;gap:8px}.ib.alt2{background:#EEF3FF;color:var(--ink)}
.mono{display:grid;gap:12px;margin-top:14px}
.mc{background:var(--card);color:var(--ink);border-radius:18px;padding:12px;display:grid;gap:10px;box-shadow:0 5px 0 rgba(0,0,0,.25);transition:outline .2s}
.mc.now{outline:4px solid var(--gold)}
.mc img{width:100%;border-radius:10px;display:block}
.mt{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}.mt b{font-family:var(--f-game);font-size:17px}.mt span{font-weight:800;color:#fff;background:var(--orange);border-radius:99px;padding:2px 10px;font-size:13px;font-variant-numeric:tabular-nums}
.mc p{margin:4px 0 8px;font-size:16.5px;line-height:1.55}
.rp{margin-top:10px;background:#F4F7FF;border-radius:14px;padding:4px 12px}.rp summary{cursor:pointer;font-weight:800;padding:8px 0;color:#2747A8}
.rq{border-top:1px solid #DCE4F7;padding:10px 0}.rq b{display:block;font-family:var(--f-game);font-size:16px}.rq p{margin:4px 0;font-size:15px;line-height:1.5}
.cf{display:inline-block;background:#FFF1C2;color:#7A5200;font-weight:700;font-size:12.5px;border-radius:8px;padding:3px 8px}
.tip{margin-top:16px;background:var(--bg2);border-radius:16px;padding:12px 14px;font-size:14px;color:#CFDAF5}
.tip a{color:var(--gold);font-weight:800}
/* play */
.top{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;margin-bottom:10px}
.ttl{font-family:var(--f-game);font-size:20px;font-weight:800;line-height:1.1;min-width:0}
.ttl small{display:block;font-family:var(--f-body);font-size:12px;color:#AFC0E8}
.lives{font-size:20px;letter-spacing:2px}
.prog{height:10px;border-radius:9px;background:var(--bg2);overflow:hidden;margin-bottom:14px}.prog i{display:block;height:100%;background:var(--green);transition:width .3s}
.timer{height:8px;border-radius:9px;background:var(--bg2);overflow:hidden;margin:-6px 0 12px}.timer i{display:block;height:100%;background:var(--gold)}
.card{background:var(--card);color:var(--ink);border-radius:22px;padding:18px;box-shadow:0 6px 0 rgba(0,0,0,.25);display:grid;gap:14px}
.card h2{margin:0;font-family:var(--f-game);font-size:22px;line-height:1.2}
.inst{font-weight:800;color:var(--muted);font-size:14px;margin:0}
.opts{display:grid;gap:10px}
.opt{background:#EEF3FF;border-radius:16px;padding:14px;text-align:left;font-weight:800;font-size:16px;color:var(--ink);box-shadow:0 4px 0 #CAD6F2;transition:transform .08s}
.opt:active{transform:translateY(2px);box-shadow:0 2px 0 #CAD6F2}
.opt.ok{background:#D9F7E8;box-shadow:0 4px 0 var(--green)}
.opt.no{background:#FFE1E2;box-shadow:0 4px 0 var(--red);animation:shake .35s}
.opt.dim{opacity:.45}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf button{padding:18px;border-radius:18px;font-family:var(--f-game);font-size:22px;font-weight:800;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.tf .v{background:var(--green)}.tf .f{background:var(--red)}
.slides{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sl{position:relative;border-radius:12px;overflow:hidden;box-shadow:0 4px 0 #CAD6F2;background:#EEF3FF;padding:0}
.sl img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.sl span{position:absolute;left:6px;top:6px;background:var(--ink);color:#fff;font-weight:800;font-size:13px;border-radius:8px;padding:2px 8px}
.sl.done{outline:4px solid var(--green)}.sl.done::after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;font-size:44px;color:#fff;background:rgba(43,182,115,.55);font-weight:800}
.sl.no{animation:shake .35s;outline:4px solid var(--red)}
.order{display:flex;flex-wrap:wrap;gap:6px}
.order b{background:var(--green);color:#fff;border-radius:9px;padding:3px 9px;font-size:13px}
.big{width:100%;border-radius:14px;display:block;box-shadow:0 4px 0 #CAD6F2}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:8px;align-content:start}
.mi{background:#EEF3FF;border-radius:14px;padding:11px;font-weight:800;font-size:14px;text-align:left;color:var(--ink);box-shadow:0 3px 0 #CAD6F2;min-height:56px}
.mi.sel{background:#FFF1C2;box-shadow:0 3px 0 var(--gold)}
.mi.ok{background:#D9F7E8;box-shadow:0 3px 0 var(--green);opacity:.7}
.mi.no{background:#FFE1E2;animation:shake .35s}
.fb{border-radius:14px;padding:12px;font-weight:700;font-size:15px}
.fb.ok{background:#D9F7E8;color:#11663F}.fb.no{background:#FFE1E2;color:#9C1F27}
.btn{width:100%;background:var(--gold);color:#3B2600;border-radius:18px;padding:15px;font-family:var(--f-game);font-size:20px;font-weight:800;box-shadow:0 6px 0 #C9951B;margin-top:14px}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #C9951B}
.btn.alt{background:var(--bg2);color:#fff;box-shadow:0 6px 0 #0B1428}
.say{display:inline-flex;align-items:center;gap:6px;background:#EEF3FF;color:var(--ink);font-weight:800;border-radius:99px;padding:6px 12px;font-size:14px;justify-self:start}
.end{text-align:center;display:grid;gap:8px;justify-items:center}
.end .s{font-size:46px;letter-spacing:4px}
.end h2{font-size:30px}
.xp{font-family:var(--f-game);font-size:22px;color:var(--green);font-weight:800}
.learn{background:#EEF3FF;border-radius:14px;padding:12px;text-align:left;font-size:15px;width:100%}
.learn b{display:block;font-family:var(--f-game);font-size:16px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:var(--ink);font-weight:800;padding:10px 16px;border-radius:14px;z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.combo{color:var(--orange);font-family:var(--f-game);font-weight:800}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const MONO = {
 dulce:[
  {n:1,t:'0:00 – 0:20',x:'Buenas tardes, señores del jurado. Somos el equipo de ServiGo, de la carrera de Administración de Empresas de CERTUS, y hoy les presentaremos nuestro Trabajo de Aplicación Profesional.'},
  {n:2,t:'0:20 – 1:00',x:'¿Alguna vez han necesitado un técnico con urgencia y no han sabido en quién confiar? ServiGo es una plataforma digital que conecta a hogares y pequeños negocios de Lima Norte con técnicos verificados. Antes de contratar, el cliente ve el perfil, las calificaciones y un precio referencial. Nuestra visión es ser la plataforma líder en el Perú para contratar servicios técnicos de forma rápida, segura y confiable.'},
  {n:3,t:'1:00 – 1:40',x:'Nuestro equipo Scrum está conformado por Angel Astudillo, Business Owner, que cuida que el producto sirva al negocio; Andre Arce, Scrum Master, que coordina al equipo y elimina impedimentos; Nayeli Mendoza, del Equipo Scrum, que diseñó la experiencia de búsqueda; y yo, Dulce Figueroa, Product Owner, encargada de la visión del producto y de priorizar el backlog.'},
  {n:4,t:'1:40 – 2:30',x:'Al entrevistar a 24 personas descubrimos que el problema no es encontrar un número, sino encontrar a alguien en quien confiar. Por eso nuestra pregunta guía fue: ¿cómo podríamos ayudar a los usuarios de Lima Norte a identificar prestadores de servicios confiables antes de contratarlos? Esta pregunta define quiénes son, cuál es el problema y el momento clave: antes de contratar.'},
  {n:5,t:'2:30 – 3:30',x:'Con el mapa de empatía entendimos a nuestro cliente, Pedro, un comerciante de Comas de 40 años. Siente estrés cuando hay un imprevisto y le falta tiempo. Ve anuncios en afiches y redes, y oye que es difícil encontrar técnicos honestos. Le duele que el técnico demore o no llegue, y le da miedo dejar entrar a un desconocido. Aspira a resolver todo desde su celular, con tranquilidad y ahorrando tiempo.'},
  {n:6,t:'3:30 – 4:30',x:'Para dimensionar el mercado usamos TAM, SAM y SOM. En Lima viven 10 millones de personas y el 60% contrata servicios para su hogar: nuestro TAM es de 6 millones de personas, unos 900 millones de soles al año. Si nos enfocamos en Lima Norte y en quienes tienen smartphone, el SAM es de 1 millón 440 mil personas. Y siendo conservadores, el 5% usaría la app al inicio: nuestro SOM es de 72,000 clientes. Ahora, Angel les explicará la competencia y nuestro modelo de negocio.'}],
 angel:[
  {n:7,t:'4:30 – 5:15',x:'Gracias, Dulce. Buenas tardes, soy Angel Sebastian Mario Astudillo Porroa, Business Owner. Analizamos tres competidores directos: Facebook Marketplace, que tiene muchos anuncios pero no verifica a nadie; Helpers, enfocado en el hogar pero con poca cobertura en algunos distritos; y el boca a boca, que es confiable pero lento en emergencias. Ninguno verifica al técnico, muestra precios antes y da garantía al mismo tiempo: esa es nuestra oportunidad.'},
  {n:8,t:'5:15 – 6:00',x:'En el FODA, nuestra fortaleza es que los usuarios ya comparan precios y opiniones antes de elegir. La oportunidad es el crecimiento de las apps y de los pagos digitales. La debilidad es la baja confianza al contratar por internet, y la amenaza, los fraudes de prestadores informales. Por eso la verificación es el corazón de ServiGo.'},
  {n:9,t:'6:00 – 7:00',x:'Este es nuestro Lean Canvas. Nuestra propuesta única es una conexión inmediata y segura con técnicos verificados de Lima Norte, con precios transparentes y garantía. Ganamos con una comisión del 10% sobre un ticket promedio de 85 soles. La inversión del primer año es de 23,183 soles. Con los 72,000 clientes de nuestro SOM, los ingresos son de 1 millón 236 mil soles, una ganancia neta de 1 millón 213 mil soles y un retorno sobre la inversión de 5,235%.'},
  {n:10,t:'7:00 – 7:45',x:'En el Customer Journey Map vemos el recorrido actual del cliente: siente la necesidad, busca por boca a boca, compara, coordina, recibe el servicio, califica y recomienda. Buscar, comparar y coordinar son experiencias negativas. En cada una proponemos una mejora: técnicos por zona, precios cotizados y calificaciones públicas.'},
  {n:11,t:'7:45 – 8:00',x:'Con esto entendido, pasamos a la construcción del producto.'},
  {n:12,t:'8:00 – 9:00',x:'En el Scope Canvas definimos el alcance. Nuestro propósito es ser el puente digital que conecta en minutos a los hogares de Lima Norte con técnicos verificados. Nuestras metas: 200 usuarios activos y 30 servicios en 3 meses, 80 técnicos verificados en el primer trimestre y 50 transacciones pagadas en 4 meses. Lo mediremos con la tasa de conversión, el tiempo de llegada y el nivel de satisfacción. Nayeli les mostrará cómo diseñamos la solución.'}],
 nayeli:[
  {n:13,t:'9:00 – 9:50',x:'Gracias, Angel. Buenas tardes, soy Nayeli Hilary Mendoza Jaimes, del Equipo Scrum. Con el Value Proposition Canvas conectamos al cliente con nuestra solución. El cliente quiere encontrar un técnico que solucione su problema, pero sufre porque no sabe en quién confiar, el técnico no está disponible y no conoce el precio. Nuestra respuesta: perfiles verificados, búsqueda por ubicación, horarios, tabla de precios y calificaciones reales. Cada dolor tiene su aliviador.'},
  {n:14,t:'9:50 – 10:40',x:'El Service Blueprint muestra cómo funciona el servicio por dentro. Arriba, lo que el cliente ve y hace: busca, compara, solicita y califica. En el medio, los puntos de contacto, como el botón "Solicitar servicio" y el chat. Y abajo, lo que la plataforma hace por detrás: filtra técnicos, envía la solicitud y registra la calificación, con un sistema disponible las 24 horas.'},
  {n:15,t:'10:40 – 11:30',x:'Con el método MoSCoW priorizamos nuestras historias de usuario. Lo que debe tener es lo que da confianza, como la plataforma, el perfil del técnico, el perfil verificado y el libro de reclamaciones. Luego vienen funciones como el chat, y lo que podría tener, como el rastreo en tiempo real. Y lo que no tendrá por ahora es el asistente virtual.'},
  {n:16,t:'11:30 – 12:20',x:'Nuestro plan de lanzamiento tuvo cuatro sprints. El Sprint 0, del 5 al 11 de octubre, fue de revisión. El Sprint 1 construyó la base de confianza; el Sprint 2, la contratación segura; y el Sprint 3, la rapidez. El lanzamiento del MVP fue el 8 de noviembre.'},
  {n:17,t:'12:20 – 12:45',x:'Cada historia de usuario se dividió en tareas con un responsable. En el Sprint 1 trabajamos la plataforma, el perfil del técnico, el filtro por distrito, la tabla de tarifas y el perfil verificado.'},
  {n:18,t:'12:45 – 13:05',x:'En el Sprint 2, el botón de conformidad, el libro de reclamaciones, la política de devoluciones y el chat en línea.'},
  {n:19,t:'13:05 – 13:30',x:'Y en el Sprint 3, los horarios, la geolocalización, el rastreo y la solicitud de emergencia. En total fueron 13 historias, 45 tareas y 67 puntos de historia, estimados con Planning Poker. Andre les contará cómo ejecutamos estos sprints.'}],
 andre:[
  {n:20,t:'13:30 – 14:20',x:'Gracias, Nayeli. Buenas tardes, soy Andre Sebastian Arce Vargas, Scrum Master. Mi rol fue facilitar el trabajo del equipo y eliminar los impedimentos. Tuvimos tres. El primero, la falta de comunicación y de horarios para reunirnos: lo resolvimos formalizando los canales de comunicación y llevando actas de reunión. El segundo, la demora en validar los documentos de los técnicos: reorganizamos el proceso por etapas, priorizando los datos necesarios. Y el tercero, externo: el retraso en el servicio de mapas. Para no detenernos, hicimos pruebas con datos simulados.'},
  {n:21,t:'14:20 – 14:50',x:'También recibimos una solicitud de cambio: un stakeholder pidió reducir las categorías de la pantalla de inicio. No la aprobamos, porque la validación de la HU03 mostró que los usuarios estaban conformes y el cambio no agregaba valor.'},
  {n:22,t:'14:50 – 15:30',x:'Aquí ven el tablero Kanban de cada sprint. Al cierre de los tres sprints, todas las historias pasaron a "Hecho" y cumplieron sus criterios de aceptación. Sprint 1, la confianza; Sprint 2, la contratación segura; y Sprint 3, la rapidez.'},
  {n:23,t:'15:30 – 16:10',x:'Este es nuestro Producto Mínimo Viable, un prototipo web navegable. El usuario se registra, busca técnicos verificados por distrito, ve las tarifas antes de contratar, conversa por chat y, si tiene una urgencia, solicita una emergencia en dos pasos. Pueden revisarlo en el enlace de la diapositiva.'},
  {n:24,t:'16:10 – 16:50',x:'En nuestra retrospectiva revisamos cómo trabajamos. Lo que hicimos bien: una excelente organización y una comunicación fluida, a pesar de nuestras responsabilidades académicas y laborales. Lo que podemos mejorar: revisar los criterios de aceptación antes de programar. Y lo que mantendremos: reuniones cortas a mitad de semana y criterios totalmente definidos desde el primer día.'},
  {n:25,t:'16:50 – 17:20',x:'Concluimos que el principal problema al contratar técnicos es la falta de confianza, información y transparencia. Design Thinking nos ayudó a convertir ese problema en una solución centrada en el usuario, y Scrum nos permitió construirla de forma organizada.'},
  {n:26,t:'17:20 – 17:50',x:'Recomendamos fortalecer la verificación de identidad, antecedentes y experiencia de los técnicos; seguir probando la plataforma con clientes reales; y aplicar marketing digital y campañas locales para sumar usuarios y técnicos.'},
  {n:27,t:'17:50 – 18:00',x:'Muchas gracias por su atención. Quedamos atentos a sus preguntas.'}]
};

 20:[
  {q:'¿Cómo detectaron los impedimentos?',a:'En las Daily por Google Meet. Cada uno decía qué hizo, qué hará y qué lo bloquea. Lo que bloqueaba se anotaba en el registro de impedimentos con su fecha y su sprint, y yo, como Scrum Master, le hacía seguimiento hasta resolverlo.'},
  {q:'¿Qué canales de comunicación formalizaron?',a:'Definimos un canal para cada cosa: Google Meet para las Daily y reuniones, el grupo de WhatsApp solo para avisos rápidos y el tablero de Miro para ver el avance de las tareas. Así nada se perdía entre mensajes.',c:true},
  {q:'¿Cómo formalizaron los horarios y las actas?',a:'Acordamos horarios fijos de reunión en la noche, porque todos trabajamos. Después de cada reunión dejábamos un acta corta: qué se acordó, quién es el responsable y para cuándo.',c:true},
  {q:'¿Por qué era lenta la validación de documentos?',a:'Porque se revisaban todos los documentos juntos, el DNI y los antecedentes penales. Si faltaba uno, todo el perfil del técnico se quedaba esperando.'},
  {q:'¿Cómo quedó el flujo por etapas?',a:'Primero se validan los datos básicos, como el DNI de 8 dígitos. Luego los antecedentes penales. Al final, un administrador aprueba o rechaza en el panel. La revisión se hace en máximo 48 horas, y el técnico no aparece en las búsquedas hasta tener sus 2 documentos aprobados.'},
  {q:'¿Cómo hicieron los datos simulados?',a:'Como el servicio de mapas aún no estaba habilitado, cargamos técnicos de ejemplo con su distrito y una ubicación aproximada, y simulamos el mapa: la distancia de 5 km, el tiempo de llegada y el movimiento del técnico, con el aviso a 500 metros. Así probamos la geolocalización y el rastreo sin depender del proveedor. En el prototipo hay 32 técnicos de ejemplo.'},
  {q:'¿Qué son las pruebas de integración?',a:'Probar que las partes funcionan juntas: que la búsqueda, el mapa y el perfil del técnico se conecten bien entre sí, aunque los datos sean de prueba.'},
  {q:'¿Por qué ese impedimento fue externo?',a:'Porque no dependía del equipo, sino del proveedor del servicio de mapas. Lo que sí controlábamos era no detenernos, y por eso usamos datos simulados.'}],
 21:[
  {q:'¿Quién pidió el cambio?',a:'Un stakeholder, es decir, una persona interesada en el proyecto, durante la revisión del prototipo.',c:true,n:'Confirma con tu equipo quién fue exactamente (un usuario entrevistado, un docente, etc.).'},
  {q:'¿Cómo decidieron si se aprobaba?',a:'Lo registramos en el formato de solicitud de cambio: la descripción, quién lo pide y si se aprueba o no. La Product Owner lo evaluó con datos: la validación de la HU03 mostró que los usuarios estaban conformes con las categorías.'},
  {q:'¿Por qué no agregaba valor?',a:'Reducir las categorías haría que el usuario no encuentre su servicio tan rápido. Las validaciones mostraron que la pantalla de inicio se entendía bien, así que el cambio no mejoraba nada.'},
  {q:'¿Cuántas categorías tiene la pantalla de inicio?',a:'El MVP tiene 16 categorías. El criterio de aceptación de la HU03 pedía como mínimo 6 visibles y llegar a un perfil en 3 clics.'}],
 22:[
  {q:'¿Qué es el tablero Kanban y dónde lo usaron?',a:'Es un tablero con columnas: Por hacer, En progreso y Finalizado. Cada tarjeta es una historia de usuario que se va moviendo. Lo usamos en Miro.'},
  {q:'¿Cómo sabían que una historia estaba terminada?',a:'Cuando cumplía su Definición de Hecho y pasaba sus criterios de aceptación. La Product Owner la aceptaba en la Sprint Review.'},
  {q:'¿Qué es la Sprint Review?',a:'Es la reunión al final del sprint donde mostramos lo construido y revisamos si cada historia cumple sus criterios: aceptada o no aceptada. Es distinta de la retrospectiva, que mejora la forma de trabajar.'}],
 23:[
  {q:'¿Cómo construyeron el MVP?',a:'Como un prototipo web navegable, hecho con apoyo de inteligencia artificial y con datos de ejemplo. Se abre desde el celular con el link.'},
  {q:'¿Es una app real?',a:'Es un prototipo con datos de ejemplo para validar la idea. La versión real se conectaría a una base de datos y a la verificación de DNI.'},

  {q:'¿Qué técnica usaron?',a:'Revisamos qué hicimos bien, qué podemos mejorar y qué debemos mantener. En la tesis también registramos las retros con el formato 4L: lo que nos gustó, lo que faltó, lo que deseamos y lo que aprendimos.'},

  let f=0; (function loop(){ x.clearRect(0,0,c.width,c.height); P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=.1;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore();}); if(++f<160) requestAnimationFrame(loop); else x.clearRect(0,0,c.width,c.height); })(); }

function renderEnd(){ const e=V; const idx=LV().indexOf(e.L); const nx=LV()[idx+1];
  return `<div class="card end" style="margin-top:30px"><div class="s">${'⭐'.repeat(e.st)}${'☆'.repeat(3-e.st)}</div><h2>${e.lost?'¡Te quedaste sin vidas!':e.st===3?'¡Perfecto!':e.st===2?'¡Muy bien!':'¡Pasaste!'}</h2>
   <div class="xp">+${e.xp} XP</div><div class="learn"><b>🧠 Llévate esto</b>${e.L.learn}</div></div>
   ${e.lost||e.st<3?`<button class="btn" data-a="retry" data-i="${e.li}">${e.lost?'Intentar de nuevo':'Ir por las 3 estrellas'}</button>`:''}
   ${!e.lost&&nx&&e.L.id!=='R'?`<button class="btn ${e.st<3?'alt':''}" data-a="play" data-i="${idx+1}">Siguiente nivel →</button>`:''}
   <button class="btn alt" data-a="map">Volver al mapa</button>`; }
function renderLogin(){
  if(!V.who) return `<div class="hud"><div class="brand">ServiGo Quest<small>Juego para la sustentación</small></div></div>${installCard()}
   <div class="hero"><h1>¿Quién va a jugar?</h1><p>Entra con la misma contraseña de la app de estudio.</p></div>
   <div class="map">${Object.entries(PACKS).map(([k,p])=>`<button class="lvl" data-a="who" data-w="${k}"><span class="ic" style="background:${({andre:'#FF8A3D',angel:'#4F8CFF',dulce:'#2BB673',nayeli:'#9B6BFF'})[k]}">${p.name[0]}</span><span><h3>${p.name}</h3><small>${p.role} · diapositivas ${p.from} a ${p.to}</small></span><span class="stars">›</span></button>`).join('')}</div>`;
  const p=PACKS[V.who]; const nuevo=V.acc===false; const loading=V.acc===undefined;
  return `<div class="top"><button class="back" data-a="unwho" aria-label="Volver">←</button><div class="ttl">Hola, ${p.name}<small>${p.role}</small></div><span></span></div>
   <div class="card">${loading?'<p class="inst">Cargando…</p>':`<form id="lf" style="display:grid;gap:10px">
    <label for="pw" class="inst">${nuevo?'Crea tu contraseña (mínimo 4 caracteres)':'Tu contraseña (la misma de la app de estudio)'}</label>
    <input id="pw" type="password" autocomplete="${nuevo?'new-password':'current-password'}" minlength="4" required style="font:inherit;font-size:18px;padding:14px;border-radius:14px;border:2px solid #CAD6F2">
    ${nuevo?'<label for="pw2" class="inst">Repítela</label><input id="pw2" type="password" autocomplete="new-password" minlength="4" required style="font:inherit;font-size:18px;padding:14px;border-radius:14px;border:2px solid #CAD6F2">':''}
    ${V.err?`<div class="fb no">${V.err}</div>`:''}
    <button class="btn" type="submit" style="margin-top:4px">${nuevo?'Crear y jugar':'Entrar a jugar'} 🎮</button></form>`}</div>`; }
async function pickWho(w){ V={view:'login',who:w,acc:undefined}; render(); let ex=null; try{ ex=await rpc('se_status',{p_who:w}); }catch(e){ ex=null; }
  if(V.who!==w) return; V.acc = ex===null? 'offline' : ex; render(); const el=document.getElementById('pw'); if(el) el.focus(); }
async function doLogin(){ const pw=(document.getElementById('pw')||{}).value||'', pw2=(document.getElementById('pw2')||{}).value;
  if(pw.length<4){ V.err='La contraseña debe tener al menos 4 caracteres.'; render(); return; }
  const h=await sha('servigo:'+V.who+':'+pw);
  if(V.acc===false){ if(pw!==pw2){ V.err='Las contraseñas no coinciden.'; render(); return; } try{ const ok=await rpc('se_register',{p_who:V.who,p_hash:h}); if(!ok){ V.err='Esa cuenta ya existe. Vuelve atrás e inténtalo de nuevo.'; render(); return; } }catch(e){ V.err='Sin internet. Conéctate para crear tu cuenta.'; render(); return; } }
  else if(V.acc===true){ let d; try{ d=await rpc('se_quest_load',{p_who:V.who,p_hash:h}); }catch(e){ V.err='Sin internet. Revisa tu conexión.'; render(); return; } if(d===null){ V.err='Contraseña incorrecta.'; render(); return; } }
  else { const saved=lsGet(KEY+'-h-'+V.who); if(saved && saved!==h){ V.err='Contraseña incorrecta.'; render(); return; } }
  WHO=V.who; HASH=h; lsSet(KEY+'-who',WHO); lsSet(KEY+'-h-'+WHO,h); usePack(WHO); await loadG(); V={view:'map'}; render(); beep('win'); }
function render(){ $('#app').innerHTML = V.view==='login'? renderLogin() : V.view==='map'? renderMap() : V.view==='mono'? renderMono() : V.view==='play'? renderPlay() : renderEnd(); }
// ===================== EVENTOS =====================
document.addEventListener('click',e=>{ const b=e.target.closest('[data-a]'); if(!b) return; const a=b.dataset.a;
  if(a==='who'){ pickWho(b.dataset.w); return; }
  if(a==='world'){ stopMono(); const w=b.dataset.w; if(w==='mono'){ V={view:'mono',mw:WHO}; } else { applyWorld(w); V={view:'map'}; } render(); window.scrollTo(0,0); return; }
  if(a==='mw'){ stopMono(); V.mw=b.dataset.w; V.now=null; render(); return; }
  if(a==='memo'){ V.memo=!V.memo; render(); return; }
  if(a==='clock'){ if(V.t0){ const s=(Date.now()-V.t0)/1000; clearInterval(CK); V.t0=null; render(); toast('Tiempo: '+fmt(s)+(s>290?' · ¡Te pasaste! Recorta un poco.':' · ¡Bien de tiempo!')); } else { V.t0=Date.now(); CK=setInterval(()=>{ const b=document.querySelector('[data-a=clock]'); if(b&&V.t0) b.textContent='⏹ '+fmt((Date.now()-V.t0)/1000); else clearInterval(CK); },500); render(); } return; }
  if(a==='monoplay'){ if(V.playing){ stopMono(); render(); return; } const M=MONO[V.mw||WHO]; V.playing=true; render(); speakList(M.map(m=>m.x),k=>{ V.now=k; render(); const el=document.getElementById('mc'+k); if(el) el.scrollIntoView({behavior:'smooth',block:'center'}); }); return; }
  if(a==='monok'){ const M=MONO[V.mw||WHO]; const k=+b.dataset.k; V.playing=true; speakList([M[k].x],()=>{ V.now=k; render(); }); return; }
  if(a==='unwho'){ V={view:'login'}; render(); return; }
  if(a==='logout'){ lsSet(KEY+'-who',''); WHO=null; HASH=null; G=BLANK(); V={view:'login'}; render(); window.scrollTo(0,0); return; }
  if(a==='install'){ if(DP){ DP.prompt(); DP.userChoice.then(()=>{ DP=null; render(); }); } return; }
  if(a==='instx'){ try{localStorage.setItem(KEY+'-inst','1');}catch(e){} render(); return; }
  if(a==='map'){ stopMono(); clearInterval(TM); V={view:'map'}; render(); window.scrollTo(0,0); }
  else if(a==='locked'){ beep('no'); toast('🔒 Gana al menos 1 estrella en el nivel anterior'); }
  else if(a==='play'||a==='retry'){ startLevel(+b.dataset.i); window.scrollTo(0,0); }
  else if(a==='rapid'){ startLevel(0,true); window.scrollTo(0,0); }
  else if(a==='ord'){ const n=+b.dataset.n; if(n===V.next){ good(); V.wrong=null; V.next++; if(V.next>TO){ finish(); return; } } else { lifeLost(); V.wrong=n; if(V.lives<=0){ finish(); return; } setTimeout(()=>{V.wrong=null; if(V.view==='play') render();},400); } render(); }
  else if(a==='ml'){ V.sel=+b.dataset.k; V.wr=null; beep('tap'); render(); }
  else if(a==='mr'){ if(V.sel==null){ toast('Primero toca una tarjeta de la izquierda'); return; } const k=+b.dataset.k;
     if(k===V.sel){ good(); V.done.push(k); V.sel=null; if(V.done.length===3){ V.round++; if(V.round>=MATCH.length){ render(); setTimeout(finish,350); return; } setupMatch(); } }
     else { lifeLost(); V.wr=k; if(V.lives<=0){ finish(); return; } setTimeout(()=>{V.wr=null; if(V.view==='play') render();},400); } render(); }
  else if(a==='ans'){ answer(+b.dataset.k); }
  else if(a==='tf'){ answer(+b.dataset.k); }
  else if(a==='sl'){ const q=V.qs[V.step]; const k=+b.dataset.k; V.answered={k,ok:k===q.n}; if(k===q.n) good(); else lifeLost(); render(); }
  else if(a==='speak'){ speak(SAY[+b.dataset.n]); }
  else if(a==='next'){ nextQ(); window.scrollTo(0,0); }
});
document.addEventListener('submit',e=>{ e.preventDefault(); if(e.target.id==='lf') doLogin(); });
(async()=>{ const w=lsGet(KEY+'-who'); if(w&&PACKS[w]){ WHO=w; HASH=lsGet(KEY+'-h-'+w)||null; usePack(w); const l=lsGet(KEY+'-'+w); if(l) try{G=Object.assign(BLANK(),JSON.parse(l));}catch(e){} V={view:'map'}; render(); await loadG(); if(V.view==='map') render(); } else { V={view:'login'}; render(); } })();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
</body>
