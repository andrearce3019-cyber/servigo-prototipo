<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E6B45">
<meta name="description" content="Estudia tu tesis ServiGo: lecciones con voz, preguntas, modo jurado y simulacro de sustentación.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ServiGo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Estudia ServiGo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: una columna tipo app móvil (máx. 560px), tarjetas tipo "historia" para estudiar */
:root{
  --bg:#F3F7F4; --surface:#FFFFFF; --surface-2:#E7F2EC; --fg:#13241B; --muted:#55685E; --line:#D5E3DA;
  --brand:#1E6B45; --brand-d:#154F33; --brand-ink:#FFFFFF; --accent:#F2B53A; --blue:#2563EB;
  --ok:#1F8A4C; --bad:#C2412D; --warn-bg:#FFF4E0; --warn-fg:#8A4B00;
  --f-display:'Montserrat',system-ui,sans-serif; --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1511; --surface:#14211A; --surface-2:#1B2E24; --fg:#E4EFE8; --muted:#9DB3A6; --line:#28402F;
  --brand:#47B67C; --brand-d:#7FD3A6; --brand-ink:#06140D; --accent:#F2B53A; --blue:#6E9BFF;
  --ok:#4CC27F; --bad:#FF7A66; --warn-bg:#2E2412; --warn-fg:#F5C36B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1511; --surface:#14211A; --surface-2:#1B2E24; --fg:#E4EFE8; --muted:#9DB3A6; --line:#28402F;
  --brand:#47B67C; --brand-d:#7FD3A6; --brand-ink:#06140D; --accent:#F2B53A; --blue:#6E9BFF;
  --ok:#4CC27F; --bad:#FF7A66; --warn-bg:#2E2412; --warn-fg:#F5C36B; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:18px;color:var(--brand-d)}
.logo svg{width:30px;height:30px}
.count{font-size:13px;font-weight:600;background:var(--surface-2);color:var(--brand-d);padding:6px 10px;border-radius:99px;white-space:nowrap}
.hero{background:var(--brand);color:var(--brand-ink);border-radius:var(--r);padding:18px;display:grid;gap:10px}
.hero .eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;opacity:.85}
.hero h2{font-size:22px}
.hero .chips{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:inherit;padding:9px 12px;border-radius:12px;font-weight:600;font-size:14px;text-align:left}
:root[data-theme="dark"] .chipbtn{background:rgba(0,0,0,.12)}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.act{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 8px;display:grid;justify-items:center;gap:6px;font-size:13px;font-weight:600;text-align:center}
.act svg{width:26px;height:26px;color:var(--brand)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:22px;color:var(--brand-d);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.sec{margin:22px 0 10px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.mods{display:grid;gap:8px}
.mod{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;width:100%}
.mod .num{width:40px;height:40px;border-radius:12px;background:var(--surface-2);color:var(--brand-d);display:grid;place-items:center;font-family:var(--f-display);font-weight:800}
.mod.done .num{background:var(--brand);color:var(--brand-ink)}
.mod h3{font-size:15px}
.mod small{display:block;color:var(--muted);font-size:12.5px}
.mod .right{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.you{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--accent);color:#3B2600;padding:2px 7px;border-radius:99px;margin-left:6px;vertical-align:2px}
/* Viewer */
.vtop{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin-bottom:10px}
.iconbtn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.iconbtn svg{width:22px;height:22px}
.vtitle{font-size:13px;color:var(--muted);font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.segs{display:flex;gap:4px;margin-bottom:14px}
.segs i{flex:1;height:5px;border-radius:9px;background:var(--line)}
.segs i.on{background:var(--brand)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px 20px;min-height:52vh;display:flex;flex-direction:column;gap:14px;animation:in .28s ease}
@keyframes in{from{transform:translateY(8px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
.card .eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--brand)}
.card h2{font-size:24px}
.card p{margin:0;font-size:17px}
.key{background:var(--surface-2);border-radius:14px;padding:12px 14px;font-weight:700;color:var(--brand-d);display:flex;gap:10px;align-items:flex-start}
.key svg{flex:none;width:20px;height:20px;margin-top:2px}
.bign{font-family:var(--f-display);font-weight:800;font-size:clamp(44px,14vw,72px);line-height:1;color:var(--brand);font-variant-numeric:tabular-nums;word-break:break-word}
.bigl{font-family:var(--f-display);font-weight:700;font-size:20px}
.quote{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.3;border-left:4px solid var(--accent);padding-left:14px}
.list{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.list li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.tagk{background:var(--surface-2);color:var(--brand-d);font-weight:700;font-size:12.5px;padding:4px 9px;border-radius:9px;white-space:nowrap;max-width:130px;white-space:normal}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}
.cell{background:var(--surface-2);border-radius:14px;padding:11px;min-width:0;overflow-wrap:break-word;hyphens:auto}
.cell b{display:block;font-family:var(--f-display);font-size:14px;color:var(--brand-d);margin-bottom:6px}
.cell ul{margin:0;padding-left:14px;font-size:13.5px;display:grid;gap:4px}.cell li{overflow-wrap:anywhere}
.pairs{display:grid;gap:8px}
.pair{display:grid;grid-template-columns:1fr 24px 1fr;gap:6px;align-items:center}
.pair div{background:var(--surface-2);border-radius:12px;padding:10px;font-size:14px;min-width:0}
.pair div:last-child{background:transparent;border:1.5px solid var(--brand);font-weight:600}
.pair svg{width:20px;height:20px;color:var(--brand)}
.phead{display:grid;grid-template-columns:1fr 24px 1fr;gap:6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.flow{display:grid;gap:0}
.fstep{background:var(--surface-2);border-radius:14px;padding:12px 14px}
.fstep b{font-family:var(--f-display);display:block;font-size:16px;color:var(--brand-d)}
.fstep span{font-size:14px;color:var(--muted)}
.farrow{display:grid;place-items:center;height:22px;color:var(--brand)}
.farrow svg{width:18px;height:18px}
.tl{display:grid;gap:0;position:relative}
.tli{display:grid;grid-template-columns:54px 1fr;gap:12px;padding-bottom:12px;position:relative}
.tli .dot{font-family:var(--f-display);font-weight:800;background:var(--brand);color:var(--brand-ink);border-radius:12px;display:grid;place-items:center;height:36px;font-size:13px}
.tli b{display:block;font-variant-numeric:tabular-nums}
.tli span{font-size:14px;color:var(--muted)}
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:118px 1fr 22px;gap:8px;align-items:center;font-size:13px}
.bar i{display:block;height:12px;border-radius:9px;background:var(--brand)}
.bar em{font-style:normal;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.persona{display:grid;grid-template-columns:80px 1fr;gap:14px;align-items:center}
.ava{width:80px;height:80px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:28px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.facts div{background:var(--surface-2);border-radius:12px;padding:8px 10px;font-size:14px}
.facts small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:13.5px}
.tbl th,.tbl td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tbl td.num{text-align:center;font-variant-numeric:tabular-nums}
.pill{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--surface-2);color:var(--brand-d)}
.pill.Should{background:#E3ECFF;color:#1E40AF}.pill.Could{background:var(--warn-bg);color:var(--warn-fg)}
:root[data-theme="dark"] .pill.Should{background:#1C2A4A;color:#A9C1FF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.Should{background:#1C2A4A;color:#A9C1FF}}
.warn{background:var(--warn-bg);color:var(--warn-fg);border-radius:14px;padding:12px 14px;font-weight:600;font-size:14px}
.card.warncard{border-color:var(--accent)}
.remember{display:grid;gap:10px}
.remember div{display:flex;gap:10px;align-items:center;background:var(--surface-2);border-radius:14px;padding:12px;font-weight:700;color:var(--brand-d)}
.remember svg{width:22px;height:22px;flex:none}
.youtag{align-self:flex-start;background:var(--accent);color:#3B2600;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px}
.curve svg{width:100%;height:auto;display:block}
.clist{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:13px;margin-top:6px}
.clist span b{font-variant-numeric:tabular-nums;color:var(--brand)}
/* Controls */
.ctrl{display:grid;grid-template-columns:52px 1fr 52px;gap:10px;margin-top:14px;align-items:center}
.btn{background:var(--brand);color:var(--brand-ink);font-weight:700;border-radius:14px;padding:14px 16px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:22px;height:22px}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.btn.sm{padding:10px 12px;font-size:14px}
.navb{height:52px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.navb svg{width:24px;height:24px}
.navb:disabled{opacity:.35}
.speed{display:flex;gap:6px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.speed button{font-size:13px;font-weight:600;padding:6px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface)}
.speed button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.note{font-size:13px;color:var(--muted);text-align:center;margin-top:8px}
/* Quiz */
.opts{display:grid;gap:10px}
.opt{background:var(--surface-2);border:2px solid transparent;border-radius:14px;padding:13px 14px;text-align:left;font-weight:600}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.fb{border-radius:14px;padding:12px 14px;font-size:15px}
.fb.ok{background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.fb.no{background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.fb b{display:block;margin-bottom:2px}
.score{font-family:var(--f-display);font-weight:800;font-size:64px;color:var(--brand);line-height:1}
/* Jury */
.jq{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.3}
.ans{background:var(--surface-2);border-radius:14px;padding:14px;font-size:16px}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate button{border-radius:14px;padding:12px 6px;font-weight:700;font-size:14px;border:2px solid var(--line);background:var(--surface)}
.rate .r0{border-color:var(--bad);color:var(--bad)}.rate .r1{border-color:var(--accent)}.rate .r2{border-color:var(--ok);color:var(--ok)}
.card textarea{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--surface-2);border:1.5px solid var(--line);border-radius:14px;padding:12px;resize:vertical;min-height:140px}
.card textarea:focus{outline:none;border-color:var(--brand)}
.linkbtn{display:block;margin:12px auto 0;font-size:14px;font-weight:600;color:var(--muted);text-decoration:underline;padding:6px}
.mine{border:1.5px dashed var(--line);border-radius:14px;padding:10px 12px;font-size:15px;white-space:pre-wrap}
.mine small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.res{display:grid;gap:8px}
.resh{display:flex;justify-content:space-between;align-items:center}
.pct{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--brand)}
.kl{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.kl li{display:flex;gap:8px;align-items:flex-start;font-size:14.5px;font-weight:600}
.kl svg{width:18px;height:18px;flex:none;margin-top:2px}
.kl .kok svg{color:var(--ok)} .kl .kno{color:var(--muted)} .kl .kno svg{color:var(--bad)}
.rate button.sug{box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 35%,transparent)}
.who{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;background:var(--surface);border:1px solid var(--line);padding:6px 10px;border-radius:99px}
.who svg{width:16px;height:16px}
.dday{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface-2);color:var(--brand-d);border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:13px}
.dday b{font-family:var(--f-display);font-size:16px}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;align-items:center;gap:8px;background:var(--accent);color:#3B2600;font-weight:800;padding:12px 16px;border-radius:99px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.fab svg{width:22px;height:22px}
.wrap{padding-bottom:90px}
.login{display:grid;gap:16px;padding-top:10px}
.logo.big{font-size:22px}.logo.big svg{width:38px;height:38px}
.login h2{font-size:26px}
.people{display:grid;gap:10px}
.person{display:grid;grid-template-columns:52px 1fr 24px;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left}
.person b{display:block;font-family:var(--f-display);font-size:18px}.person small{color:var(--muted)}
.person svg{width:22px;height:22px;color:var(--brand)}
.ava.sm{width:52px;height:52px;font-size:22px}
.lform{display:grid;gap:8px}
.lform label{font-weight:600;font-size:14px}
.lform input,.askf input{font:inherit;font-size:16px;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;width:100%}
.lform input:focus,.askf input:focus{outline:none;border-color:var(--brand)}
.err{color:var(--bad);font-weight:600;margin:0}
.askf{display:grid;gap:8px;margin-bottom:10px}
.tawrap{position:relative}
.tawrap input{padding-right:52px}
.mic{position:absolute;right:8px;top:8px;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--brand-d)}
.mic svg{width:20px;height:20px}
.mic.live{background:var(--bad);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.chips2{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chips2 button{font-size:13px;font-weight:600;padding:7px 11px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.chips2.all button{background:var(--surface-2);border-color:transparent;color:var(--brand-d)}
.ansc{min-height:0;margin-bottom:12px}
.aitext{font-size:16px;line-height:1.55}
.hist{display:grid;gap:6px}
.hist button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
.simbtn{width:100%;display:grid;grid-template-columns:44px 1fr 22px;gap:12px;align-items:center;text-align:left;background:var(--accent);color:#3B2600;border-radius:18px;padding:14px;margin-top:12px}
.simbtn svg{width:28px;height:28px}.simbtn b{display:block;font-family:var(--f-display);font-size:17px}.simbtn small{font-size:12.5px;font-weight:600;opacity:.85}
.inst{display:grid;grid-template-columns:34px 1fr;gap:10px;background:var(--surface);border:2px dashed var(--brand);border-radius:16px;padding:12px 14px;margin:12px 0 0}
.inst>svg{width:30px;height:30px;color:var(--brand)}.inst>div>b{display:block;font-family:var(--f-display);font-size:16px}.inst span{font-size:14px}.inst .row{margin-top:8px}.inst .linkbtn{margin:0}
.timer{font-family:var(--f-display);font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted)}.timer.late{color:var(--bad)}
.score small{font-size:24px;color:var(--muted)}
.lvl{font-weight:800;font-size:13px;padding:4px 12px;border-radius:99px;text-transform:uppercase;letter-spacing:.05em}
.lvl.ok,.sn.ok{background:color-mix(in srgb,var(--ok) 18%,var(--surface));color:var(--ok)}.lvl.mid,.sn.mid{background:var(--warn-bg);color:var(--warn-fg)}.lvl.bad,.sn.bad{background:color-mix(in srgb,var(--bad) 15%,var(--surface));color:var(--bad)}
.warnl div{background:var(--warn-bg);color:var(--warn-fg)}
.simres{display:grid;gap:8px}
.sq{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sq summary{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;padding:12px;cursor:pointer;font-weight:600;font-size:14.5px;list-style:none}
.sq summary::-webkit-details-marker{display:none}
.sn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:17px}
.sqb{padding:0 12px 12px;display:grid;gap:10px;font-size:15px}.sqb p{margin:0}
.hnotes{display:flex;gap:8px;flex-wrap:wrap}.hnotes span{background:var(--surface-2);border-radius:12px;padding:6px 10px;font-size:13px;text-align:center}.hnotes b{font-family:var(--f-display);font-size:18px;color:var(--brand-d)}.hnotes small{display:block;color:var(--muted);font-size:11px}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--brand);animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{font-size:13px;font-weight:600;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface)}
.tabs button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.plan{display:grid;gap:8px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:center}
.day.today{border:2px solid var(--brand)}
.day.past{opacity:.6}
.day .d{font-family:var(--f-display);font-weight:800;text-align:center;line-height:1.1;color:var(--brand-d)}
.day .d small{display:block;font-family:var(--f-body);font-weight:600;font-size:11px;color:var(--muted);text-transform:uppercase}
.day .t{font-size:14px}
.day .m{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.day .m button{font-size:12px;font-weight:600;padding:4px 9px;border-radius:99px;background:var(--surface-2);color:var(--brand-d)}
.day .m button.dn{background:var(--brand);color:var(--brand-ink)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:20;max-width:90vw}
</style>

<script>
// ====== CONTENIDO (fuente: tesis final + PPT de sustentación) ======
const MODULES = [
{ id:'m1', n:1, title:'ServiGo en 1 minuto', tag:'Introducción', mins:4, cards:[
  {t:'title', eyebrow:'La pregunta de todo', h:'¿En quién puedo confiar?', p:'Es lo primero que piensa alguien cuando necesita un gasfitero, un electricista o un cerrajero. ServiGo nace para responder esa pregunta.'},
  {t:'text', h:'¿Qué es ServiGo?', p:'Una plataforma digital que conecta a hogares y pequeños negocios de Lima Norte con técnicos verificados. Antes de contratar, el cliente ve el perfil, las calificaciones, las reseñas y un precio referencial.', key:'Conectar + verificar + mostrar precio antes'},
  {t:'quote', h:'El How Might We (la pregunta guía)', q:'¿Cómo podríamos ayudar a los usuarios de Lima Norte a identificar prestadores de servicios confiables antes de contratarlos?', by:'Delimita 3 cosas: QUIÉNES (usuarios de Lima Norte) · PROBLEMA (identificar técnicos confiables en urgencias) · MOMENTO (antes de contratarlos)'},
  {t:'list', h:'Visión y misión', items:[['Visión','Ser la plataforma líder en el Perú para contratar servicios técnicos: rápida, segura y confiable.'],['Misión','Facilitar la contratación de trabajadores independientes con profesionales verificados, de forma rápida, segura y transparente.']], say:'La visión es a dónde queremos llegar: ser la plataforma líder en el Perú para contratar servicios técnicos. La misión es lo que hacemos cada día: facilitar la contratación de técnicos verificados, de forma rápida, segura y transparente.'},
  {t:'pairs', h:'Dos metodologías', lh:'Metodología', rh:'Para qué', items:[['Design Thinking','Entender al usuario: entrevistas, protopersona, mapas'],['Scrum','Construir el producto por partes: sprints de unos 9 días']], say:'Usamos dos metodologías. Design Thinking, para entender al usuario con entrevistas y mapas. Y Scrum, para construir el producto por partes, en sprints.'},
  {t:'quote', h:'La frase final del Elevator Pitch', q:'ServiGo: encuentra, compara y contrata al técnico que necesitas, con rapidez y confianza.', by:'Apréndetela: sirve para abrir o cerrar cualquier respuesta.'},
]},
{ id:'m2', n:2, title:'El equipo Scrum', tag:'Equipo', mins:3, cards:[
  {t:'grid', h:'Quién es quién', cells:[['Angel · Business Owner',['Identificó las necesidades de los usuarios','Revisó que las funciones sirvan al negocio']],['Andre (tú) · Scrum Master',['Coordinó la organización del equipo','Identificó impedimentos']],['Dulce · Product Owner',['Definió la visión y la propuesta de valor','Priorizó el backlog']],['Nayeli · Equipo Scrum',['Diseñó la búsqueda rápida y segura','Propuso mejoras de experiencia']]], say:'Angel es el Business Owner: identificó las necesidades del usuario y cuidó que las funciones sirvan al negocio. Tú, Andre, eres el Scrum Master: coordinaste al equipo e identificaste impedimentos. Dulce es la Product Owner: definió la visión y priorizó el backlog. Nayeli es el Equipo Scrum: diseñó la búsqueda rápida y segura y propuso mejoras de experiencia.'},
  {t:'text', h:'Tu rol: Scrum Master', p:'El Scrum Master NO es el jefe. Es un facilitador: ayuda a que el equipo siga Scrum, organiza las reuniones y quita los obstáculos (impedimentos) que frenan el trabajo.', key:'Facilita y quita obstáculos. No da órdenes.', you:true},
  {t:'list', h:'Los 4 roles en una línea', items:[['Business Owner','Mira el negocio: ¿esto sirve y genera valor?'],['Product Owner','Decide QUÉ se construye y en qué orden (prioriza el backlog)'],['Scrum Master','Cuida CÓMO trabaja el equipo y quita impedimentos'],['Equipo Scrum','Construye el producto']]},
  {t:'list', h:'Valores de trabajo (Management 3.0)', items:[['1','Autonomía del equipo'],['2','Respeto en el equipo'],['3','Responsabilidad y autodisciplina'],['4','Foco en la tarea'],['5','Información, transparencia y visibilidad']], say:'Los valores de trabajo vienen de Management 3.0. Son cinco: autonomía del equipo, respeto, responsabilidad y autodisciplina, foco en la tarea, y transparencia y visibilidad de la información.'},
]},
{ id:'m3', n:3, title:'Pedro, nuestro cliente', tag:'Protopersona y empatía', mins:5, cards:[
  {t:'persona', h:'Pedro López', facts:[['Edad','40 años'],['Ocupación','Comerciante'],['Distrito','Comas'],['Estado civil','Casado'],['Educación','Secundaria completa'],['Ingresos','S/ 3,800 al mes']], say:'Nuestra protopersona es Pedro López: 40 años, comerciante de Comas, casado, con secundaria completa y unos 3,800 soles de ingreso al mes.'},
  {t:'list', h:'Cómo se comporta Pedro', items:[['Apurado','Vida acelerada, casi no tiene tiempo'],['Digital','Usa apps para pedir servicios y pagar'],['Cuidadoso','Compara calificaciones antes de contratar'],['Clave','Valora más la disponibilidad inmediata que el precio; paga más si es confiable']]},
  {t:'text', h:'Qué necesita Pedro', p:'Soluciones rápidas cuando hay una emergencia. Técnicos confiables en un solo lugar. Resolver sin afectar su negocio ni perder dinero. Ver calificaciones y experiencia antes de contratar.', key:'Rápido · confiable · en un solo lugar'},
  {t:'grid', h:'Mapa de empatía (1/2)', cells:[['¿Qué piensa y siente?',['Le falta tiempo libre','Estrés cuando hay un imprevisto']],['¿Qué ve?',['Comerciantes buscando técnicos confiables','Anuncios en afiches y redes']],['¿Qué oye?',['Lo difícil que es encontrar técnicos honestos','Recomendaciones de familia y amigos']],['¿Qué le duele?',['Técnicos que demoran horas o no llegan','Dejar entrar a un desconocido']]]},
  {t:'grid', h:'Mapa de empatía (2/2)', cells:[['¿Qué esfuerzos hace?',['Prefiere pagar un precio justo por un servicio garantizado','Pide contactos de confianza a sus colegas']],['¿A qué aspira?',['Tranquilidad: resolver todo desde el celular','Ahorrar tiempo y dinero comparando en un solo lugar']]]},
  {t:'remember', items:['Pedro = 40 años, comerciante, Comas','Disponibilidad > precio','Su mayor miedo: dejar entrar a un desconocido']},
]},
{ id:'m4', n:4, title:'Lo que escuchamos', tag:'Entrevistas y hallazgos', mins:6, cards:[
  {t:'big', n:'24', l:'entrevistas de exploración', p:'Con una guía de 23 preguntas a personas que habían contratado técnicos. La mayoría de Lima Norte, como San Martín de Porres.', say:'Hicimos 24 entrevistas de exploración, con una guía de 23 preguntas, a personas que habían necesitado o contratado un técnico.'},
  {t:'list', h:'Creencias', items:[['1','"Lo barato sale caro": mala calidad o riesgo de robo'],['2','Confianza = identidad + experiencia + trabajos anteriores + recomendaciones'],['3','Los precios son arbitrarios y las reseñas en redes no siempre son reales']]},
  {t:'list', h:'Hábitos', items:[['1','Piden recomendaciones o buscan afiches en el mercado'],['2','Mandan fotos o videos por WhatsApp antes de contratar'],['3','Consultan 2 o 3 técnicos para comparar o regatear']]},
  {t:'list', h:'Sugerencias', items:[['1','Validar DNI y antecedentes penales de los técnicos'],['2','Un catálogo con precios, calificaciones y disponibilidad'],['3','Garantía formal y canal de reclamos']]},
  {t:'list', h:'Necesidades insatisfechas', items:[['1','No pueden verificar la reputación del técnico'],['2','No encuentran un técnico disponible en una emergencia'],['3','No saben cuánto cuesta ni qué incluye (mano de obra vs. materiales)']]},
  {t:'list', h:'Puntos de dolor', items:[['1','Llegan tarde, no cumplen horarios o cancelan'],['2','Trabajo mal hecho y después no contestan'],['3','Cobran adicionales que no se pactaron']]},
  {t:'list', h:'Lo que ya usan (competencia)', items:[['Redes','Facebook Marketplace e Instagram'],['Tienda','El servicio técnico de Sodimac'],['Videos','TikTok para ver presupuestos']]},
  {t:'pairs', h:'De hallazgo a función', lh:'Lo que dijeron', rh:'Lo que construimos', items:[['Cobran adicionales','HU10 Botón de conformidad (precio bloqueado)'],['Mandan fotos por WhatsApp','HU04 Chat con fotos y videos'],['Piden validar DNI','HU05 Perfil verificado'],['No saben el precio','HU02 Tabla de tarifas']], say:'Cada hallazgo se convirtió en una historia de usuario. Por ejemplo: como cobran adicionales, creamos el botón de conformidad con precio bloqueado. Como mandan fotos por WhatsApp, creamos el chat con fotos y videos. Como piden validar el DNI, creamos el perfil verificado. Y como no saben el precio, creamos la tabla de tarifas.'},
]},
{ id:'m5', n:5, title:'Validation Board', tag:'Hipótesis', mins:4, cards:[
  {t:'text', h:'¿Qué es el Validation Board?', p:'Una herramienta de Lean Startup para escribir hipótesis y probarlas con clientes reales antes de construir. Tiene columnas: Inicio, 1er pivote, 2do pivote… Si una hipótesis falla, se pivotea.', key:'Pivotear = cambiar de rumbo si la hipótesis resulta falsa'},
  {t:'list', h:'Nuestras hipótesis (columna Inicio)', items:[['Cliente','Usuarios que tienen dificultades para encontrar técnicos confiables'],['Problema','Falta de confianza al contratar técnicos desconocidos'],['Solución','Plataforma con técnicos verificados, experiencia, calificaciones y referencias']]},
  {t:'list', h:'El experimento', items:[['Mayor riesgo','Los usuarios de Lima Norte consideran importante tener información verificada del técnico antes de contratarlo'],['Método','Entrevistas a usuarios de Lima Norte que contrataron técnicos'],['Criterio de éxito','Al menos el 65% de los entrevistados']]},
  {t:'big', n:'0', l:'pivotes', p:'Todas las hipótesis quedaron validadas: necesidad de contratar rápido, uso del boca a boca, interés en una plataforma, dificultad para comparar e importancia de la información verificada. Ninguna fue invalidada.', say:'No tuvimos que pivotear. Todas las hipótesis se validaron: la necesidad de contratar rápido, el uso del boca a boca, el interés en una plataforma, la dificultad para comparar y la importancia de la información verificada.'},
]},
{ id:'m6', n:6, title:'El tamaño del mercado', tag:'TAM · SAM · SOM', mins:4, cards:[
  {t:'text', h:'Una sola idea', p:'Cada hogar gasta S/ 600 al año en arreglos y tiene 4 personas. Entonces cada persona gasta S/ 150 al año. El dinero de cada nivel siempre es: personas × S/ 150.', key:'S/ 600 ÷ 4 = S/ 150 por persona'},
  {t:'flow', h:'El embudo', steps:[['TAM · 6,000,000 personas','10 M en Lima × 60% que contrata servicios → S/ 900 millones'],['SAM · 1,440,000 personas','× 30% Lima Norte × 80% con smartphone → S/ 216 millones'],['SOM · 72,000 personas','× 5% que usaría la app al inicio → S/ 10.8 millones']], say:'El TAM son 6 millones de personas: 10 millones en Lima por el 60% que contrata servicios. Son 900 millones de soles. El SAM es 1 millón 440 mil: solo Lima Norte, el 30%, y con smartphone, el 80%. Son 216 millones. Y el SOM son 72 mil personas: el 5% que usaría la app al inicio. Son 10.8 millones de soles.'},
  {t:'list', h:'¿De dónde salen los datos?', items:[['10 M en Lima','INEI: unos 10,151,000 habitantes'],['80% smartphone','INEI: 89.9% usa internet y 92% lo hace por celular (≈83%)'],['30% Lima Norte','IPSOS dice ≈26%; lo redondeamos'],['60%, S/ 600, 5%','Supuestos del equipo, conservadores']]},
  {t:'remember', items:['10 M → 6 M → 1.44 M → 72 mil','Dinero = personas × S/ 150','72,000 es la base del RSI']},
]},
{ id:'m7', n:7, title:'Competencia y FODA', tag:'Análisis', mins:5, cards:[
  {t:'grid', h:'3 competidores directos', cells:[['Facebook Marketplace',['+ Muchos anuncios, gratis y conocido','− No verifica a nadie']],['Helpers',['+ Enfocado en el hogar, más confianza','− Poca cobertura en algunos distritos']],['Boca a boca',['+ Experiencias reales de gente cercana','− Difícil en emergencias, no compara precios']]], say:'Tenemos tres competidores directos. Facebook Marketplace: muchos anuncios y gratis, pero no verifica a nadie. Helpers: enfocado en el hogar, pero con poca cobertura en algunos distritos. Y el boca a boca: experiencias reales, pero difícil en emergencias y sin forma de comparar precios.'},
  {t:'text', h:'Nuestra diferencia', p:'Ninguno verifica al técnico, muestra tarifas antes de contratar, da garantía y se enfoca en Lima Norte al mismo tiempo. ServiGo junta todo eso.', key:'Verificación + tarifas + garantía + Lima Norte'},
  {t:'grid', h:'FODA', cells:[['Fortalezas',['Aprenden de experiencias previas','Recurren a recomendaciones','Definen un presupuesto','Comparan precios y opiniones']],['Debilidades',['Baja confianza al contratar por internet','Difícil verificar identidad','Poco tiempo para comparar','Poco conocimiento técnico']],['Oportunidades',['Crece el uso de apps de servicios','Más oferta de técnicos digitales','Más pagos digitales','Más necesidad de soluciones rápidas']],['Amenazas',['Prestadores informales y fraudes','Precios que varían según demanda','Exceso de opciones','Información engañosa']]]},
  {t:'text', h:'Estrategias cruzadas (ejemplos)', p:'F+O: aprovechar que el usuario compara precios para responder rápido a hogares y negocios. D+A: fortalecer la verificación para disminuir el riesgo de fraudes de prestadores informales.', key:'FO = usar fortalezas para oportunidades · DA = reducir debilidades frente a amenazas'},
]},
{ id:'m8', n:8, title:'Lean Canvas y Customer Journey', tag:'Modelo de negocio', mins:5, cards:[
  {t:'grid', h:'Lean Canvas (1/2)', cells:[['Problema',['Difícil encontrar técnicos confiables en emergencias','Riesgo de contratar sin referencias','Tiempo perdido comparando']],['Segmentos',['Hogares y comercios de Lima Norte','Técnicos independientes que buscan clientes']],['Propuesta única',['Conexión inmediata y segura con técnicos verificados de Lima Norte, precios transparentes y garantía desde tu celular']],['Ventaja diferencial',['Validación de seguridad','Cobertura local hiperenfocada']]]},
  {t:'grid', h:'Lean Canvas (2/2)', cells:[['Solución',['Verificación y perfil digital','Tarifas y pago','Valoraciones y chat']],['Canales',['La app','Redes: Facebook, TikTok, Instagram','Referidos con código']],['Métricas',['Crecimiento de usuarios','Conversión y uso','Calidad y retención']],['Ingresos',['Comisión por servicio (10%)','Suscripción premium para técnicos','Cobro por emergencias nocturnas']]]},
  {t:'curve', h:'Customer Journey Map (AS-IS)', stages:[['Necesidad',1],['Búsqueda (boca a boca)',-1],['Compara y elige',-1],['Coordina',-1],['Recibe el servicio',1],['Califica',-1],['Recomienda',-1]], say:'El Customer Journey Map muestra el recorrido de hoy. Empieza bien, con la necesidad. Pero buscar, comparar y coordinar son experiencias negativas. Recibir el servicio es positivo, y calificar y recomendar vuelven a ser negativas, porque no hay dónde hacerlo.'},
  {t:'pairs', h:'Lo que propusimos en cada etapa negativa', lh:'Etapa', rh:'Propuesta ServiGo', items:[['Búsqueda','Técnicos disponibles en tu zona, en un solo lugar'],['Compara','Precios cotizados e información completa'],['Coordina','Contacto directo y rápido con el técnico'],['Califica / Recomienda','Estrellas, comentarios y perfil de reputación pública']]},
]},
{ id:'m9', n:9, title:'Propuesta de valor e ideas', tag:'VPC · Walt Disney', mins:5, cards:[
  {t:'pairs', h:'Value Proposition: el cliente', lh:'Lado', rh:'Qué tiene', items:[['Trabajo','Encontrar un técnico que solucione su problema'],['Dolores','No sabe en quién confiar, no está disponible, no conoce el precio'],['Beneficios buscados','Rapidez, seguridad, comparar opciones, ahorrar tiempo']]},
  {t:'pairs', h:'Cada dolor tiene su aliviador', lh:'Dolor', rh:'Aliviador', items:[['No sé en quién confiar','Perfil verificado (identidad y experiencia)'],['Dependo de recomendaciones','Calificaciones y reseñas reales'],['El técnico no está disponible','Calendario con horarios'],['No sé el precio','Tabla de precios por servicio']]},
  {t:'flow', h:'Dinámica Walt Disney', steps:[['1. Soñador','Ideas sin límites: técnicos 24 h, seguimiento, fotos y videos, pagos en la app'],['2. Realista','Cómo hacerlo: verificación, calificaciones, ubicación, cotización, chat'],['3. Crítico / Riesgos','Datos personales, técnicos que fallan, precios que cambian, falta de técnicos']], say:'La dinámica Walt Disney tiene tres roles. El soñador propone ideas sin límites, como técnicos las 24 horas o pagos en la app. El realista ve cómo hacerlas posibles. Y el crítico busca los riesgos, como la protección de datos o técnicos que no cumplen.'},
  {t:'quote', h:'Elevator Pitch', q:'¿Alguna vez has necesitado un técnico con urgencia y no has sabido a quién llamar? El verdadero problema no es encontrar un número, sino encontrar a alguien en quien confiar.', by:'Y ahí nace ServiGo.'},
]},
{ id:'m10', n:10, title:'Prototipo y su validación', tag:'Blueprint · Scope · Malla', mins:5, cards:[
  {t:'list', h:'Service Blueprint (TO-BE)', items:[['Evidencias','Lo que el cliente ve: listado, perfiles, chat, calificaciones'],['Acciones del cliente','Busca, compara, solicita, califica'],['Contacto (frontstage)','Formulario, botón "Solicitar servicio", chat, llamada'],['Plataforma (backstage)','Filtra técnicos, envía la solicitud, registra la calificación'],['Soporte','Sistema 24/7, base de datos, reputación']], say:'El Service Blueprint muestra cómo funciona el servicio por dentro. Arriba, lo que el cliente ve y hace. En medio, los puntos de contacto con la plataforma. Y abajo, lo que la plataforma hace por detrás y los sistemas de soporte.'},
  {t:'list', h:'Scope Canvas: metas', items:[['Propósito','Ser el puente digital que conecta en minutos a Lima Norte con técnicos verificados'],['3 meses','200 usuarios activos y 30 servicios completados'],['1er trimestre','80 técnicos verificados'],['4 meses','50 transacciones pagadas; retención 40% usuarios y 60% técnicos a 60 días']]},
  {t:'big', n:'11', l:'entrevistas con el prototipo', p:'Con una guía de 9 preguntas: cómo lo usarían, cuándo, qué les gustó y qué mejorarían. La mayoría lo vio útil para emergencias del hogar o del negocio.', say:'Después hicimos 11 entrevistas mostrando el prototipo, con una guía de 9 preguntas. La mayoría lo vio útil para emergencias del hogar o del negocio.'},
  {t:'pairs', h:'Malla receptora: 2 ideas nuevas', lh:'Idea', rh:'Qué pasó', items:[['AE01 Emergencia (María Fernanda, dueña de restaurante)','Reforzó la HU13: solicitud de emergencia'],['EI02 Asistente virtual (Israel)','Se volvió la HU14, priorizada como "No tendrá" en este lanzamiento']]},
]},
{ id:'m11', n:11, title:'El Product Backlog', tag:'Historias de usuario', mins:7, cards:[
  {t:'quote', h:'Visión del producto', q:'Para hogares y pequeños negocios de Lima Norte que enfrentan emergencias técnicas, ServiGo conecta con técnicos verificados por DNI, experiencia y calificaciones reales, con precios estimados, tiempo de llegada real y seguimiento en vivo.', by:'A diferencia de la búsqueda informal por WhatsApp o redes sociales.'},
  {t:'text', h:'Formato de una historia de usuario', p:'COMO (quién) · QUIERO (qué) · PARA (por qué). Ejemplo: Como usuario que prioriza su seguridad, quiero ver perfiles verificados, para sentir confianza al dejar entrar al técnico.', key:'Como… Quiero… Para…'},
  {t:'hu'},
  {t:'list', h:'Listo vs. Hecho vs. Aceptación', items:[['Definición de Listo','Lo que debe estar claro ANTES de empezar (diseño aprobado, datos definidos)'],['Definición de Hecho','Lo que debe estar construido para darla por TERMINADA'],['Criterios de aceptación','Las pruebas concretas que debe pasar (números medibles)']]},
  {t:'list', h:'Ejemplo: HU05 Perfil verificado', items:[['Listo','Documentos definidos: DNI y antecedentes penales'],['Hecho','Formulario, panel de aprobación y check azul'],['Acepta si…','No aparece en búsquedas sin sus 2 documentos · DNI de 8 dígitos · revisión en 48 h máximo']]},
  {t:'list', h:'Números de los criterios (los más preguntados)', items:[['HU01','3 últimas reseñas · carga en 3 s'],['HU03','6 categorías mínimo · perfil en 3 clics'],['HU04','Mensaje en 5 s · foto 10 MB · video 30 s'],['HU07','Garantía 7 días · solicitud en 3 pasos'],['HU08','Copia en 10 min · respuesta en 15 días hábiles'],['HU09','Ubicación cada 30 s · aviso a 500 m'],['HU12','Radio de 5 km'],['HU13','2 pasos · respuesta en 10 min']]},
  {t:'grid', h:'MoSCoW (backlog priorizado)', cells:[['Must (debe)',['HU03 Plataforma','HU01 Perfil','HU11 Distrito','HU02 Tarifas','HU05 Verificado','HU10 Conformidad','HU08 Reclamos']],['Should (debería)',['HU07 Garantía','HU04 Chat','HU06 Horarios']],['Could (podría)',['HU12 Geolocalización','HU09 Rastreo','HU13 Emergencia']],["Won't (no tendrá)",['HU14 Asistente virtual']]], say:'Con MoSCoW priorizamos. Must, lo que debe tener: plataforma, perfil, filtro por distrito, tarifas, perfil verificado, botón de conformidad y libro de reclamaciones. Should: garantía, chat y horarios. Could: geolocalización, rastreo y emergencia. Y Won\'t, lo que no tendrá por ahora: el asistente virtual.'},
]},
{ id:'m12', n:12, title:'Los Sprints', tag:'Planificación', mins:6, you:true, cards:[

  {t:'list', h:'Objetivo de cada sprint', items:[['Sprint 1','La base: encontrar técnicos confiables en tu distrito (perfil, reseñas, tarifas, verificación)'],['Sprint 2','Contratar seguro: de la cotización a la conformidad (chat, garantía, reclamos)'],['Sprint 3','Rapidez: horarios, cercanía, rastreo y emergencia']]},
  {t:'text', h:'Planning Poker', p:'Cada uno estima en secreto el esfuerzo de una historia con la serie de Fibonacci (1, 2, 3, 5, 8…). Si no coinciden, se conversa y se vuelve a votar. Ejemplo: en el Chat (HU04) Dulce votó 5 y los demás 8 → quedó en 8.', key:'Estimar esfuerzo, no horas', you:true},
  {t:'bars', h:'Puntos por historia', items:[['HU04 Chat',8],['HU09 Rastreo',8],['HU01 Perfil',5],['HU03 Plataforma',5],['HU05 Verificado',5],['HU06 Horarios',5],['HU07 Garantía',5],['HU08 Reclamos',5],['HU10 Conformidad',5],['HU12 Geolocalización',5],['HU13 Emergencia',5],['HU02 Tarifas',3],['HU11 Distrito',3]], say:'Las historias más pesadas fueron el chat y el rastreo, con 8 puntos. Las más livianas, la tabla de tarifas y el filtro por distrito, con 3. En total son 67 puntos: 21 en el Sprint 1, 23 en el Sprint 2 y 23 en el Sprint 3.'},
  {t:'big', n:'45', l:'tareas (TA01–TA45)', p:'Cada historia se dividió en tareas con un responsable. Ejemplo HU03: dibujar el recorrido (Nayeli), elegir colores (Dulce), construir pantallas (Andre), publicar en internet (Angel).', you:true},

{ id:'m13', n:13, title:'Daily, cambios y retros', tag:'Seguimiento', mins:6, you:true, cards:[
  {t:'text', h:'Daily Standup', p:'Reunión corta donde cada uno dice qué hizo, qué hará y qué lo bloquea. Como Scrum Master, registraste los impedimentos y su solución.', key:'¿Qué hice? ¿Qué haré? ¿Qué me bloquea?', you:true},
  {t:'list', h:'Los 3 impedimentos', items:[['Interno · 10/10','Falta de comunicación y horarios → canales formales y actas'],['Interno · 16/10','Validación de documentos lenta → flujo por etapas'],['Externo · 23/10','Retraso del servicio de mapas → pruebas con datos simulados']], you:true},
  {t:'pairs', h:'Solicitud de cambio', lh:'Pedido', rh:'Decisión', items:[['Un stakeholder pidió reducir las categorías del inicio','NO aprobado: la validación de la HU03 mostró conformidad y no agregaba valor']]},
  {t:'text', h:'Sprint Review', p:'Al final de cada sprint se mostró el tablero Kanban con todo en "Hecho" y se revisó cada historia contra sus criterios de aceptación: Aceptado o No aceptado.', key:'Review = mostrar lo construido'},

{ id:'m14', n:14, title:'El MVP y su valor', tag:'Informe del producto', mins:4, cards:[
  {t:'text', h:'¿Qué es el MVP?', p:'El Producto Mínimo Viable: la versión más simple que sirve para probar la idea con usuarios reales. El nuestro es un prototipo web navegable: 16 categorías, 65 servicios con tarifas y 32 técnicos de ejemplo.', key:'Mínimo, pero que funcione'},
  {t:'list', h:'Lo más innovador', items:[['Emergencia','En 2 pasos; los técnicos cercanos envían su precio'],['Precio bloqueado','Cotización aceptada que no puede subir + garantía 7 días'],['Verificado','DNI y antecedentes antes de aparecer, con check azul']]},
  {t:'pairs', h:'Las 3 preguntas del informe', lh:'Pregunta', rh:'Respuesta', items:[['¿Solucionó el problema?','Sí, responde al problema; falta probarlo en un entorno real'],['¿Product Market Fit?','Señales positivas, pero aún no comprobado: faltan usuarios activos, contrataciones y retención reales'],['¿Rentable, replicable, escalable?','Rentable por comisiones; replicable a otros distritos; escalable por ser digital']]},
]},
{ id:'m15', n:15, title:'¿Es rentable? El RSI', tag:'Justificación', mins:7, you:true, cards:[
  {t:'quote', h:'Las 2 fórmulas', q:'Ingresos = (LTV − CAC) × clientes   ·   RSI = (Ingresos − Costos) ÷ Costos', by:'Todo en base anual (año 1), igual que el ejemplo del curso.'},
  {t:'flow', h:'Paso 1 · LTV', steps:[['Ticket promedio: S/ 85','Fuga S/ 85, destape S/ 105, grifo S/ 70'],['Comisión 10% → S/ 8.50','Baja para atraer técnicos (Workana cobra 10%)'],['× 3 servicios al año','Entrevistas: "3 o 4 veces al año"'],['LTV = S/ 25.50','Lo que deja un cliente en un año']]},
  {t:'flow', h:'Paso 2 · CAC', steps:[['50% redes orgánicas → S/ 0','Publicaciones propias gratis'],['40% referidos → S/ 10','S/ 5 al que recomienda + S/ 5 al nuevo'],['10% anuncios → S/ 43.22','Clic US$ 0.63 × 3.43 ÷ (10% registro × 50% contrata)'],['CAC promedio = S/ 8.32','Ponderado por canal']]},
  {t:'big', n:'S/ 1,236,830', l:'ingresos del año 1', p:'(S/ 25.50 − S/ 8.32) = S/ 17.18 por cliente × 72,000 clientes del SOM.'},
  {t:'list', h:'Costos: S/ 23,183', items:[['Desarrollo','S/ 13,500 (1 dev junior × S/ 4,500 × 3 meses)'],['IA para programar','S/ 205.80'],['Marketing','S/ 1,500 (S/ 500 × 3 meses)'],['Mantenimiento','S/ 2,741.16 (20% del desarrollo)'],['Infraestructura','S/ 1,693.88 (Supabase, dominio, mapas, DNI de 80 técnicos)'],['Empresa y marca','S/ 1,434.90 (SAC + INDECOPI)'],['Imprevistos','S/ 2,107.57 (10%)']]},
  {t:'big', n:'5,235%', l:'RSI', p:'Ganancia neta S/ 1,213,647 ÷ costos S/ 23,183. Por cada S/ 1 invertido se recupera y se ganan S/ 52.35 más. LTV/CAC = 3.06 (mayor que 3 = sano).'},
  {t:'text', h:'Si dicen que es muy alto', p:'Sale alto porque asumimos captar todo el SOM en el año 1 y la inversión es baja (app digital). Escenario pesimista: con solo 10% del SOM, el RSI sigue en 433%. Punto de equilibrio: solo 1,350 clientes.', key:'10% del SOM → 433% · equilibrio 1,350 clientes', you:true},
]},
{ id:'m16', n:16, title:'Conclusiones y recomendaciones', tag:'Cierre', mins:4, cards:[
  {t:'list', h:'Conclusiones', items:[['a','El problema central es la falta de confianza, información y transparencia'],['b','Design Thinking convirtió el problema en una solución centrada en el usuario'],['c','Scrum organizó el trabajo; la comunicación y la planificación fueron clave'],['d','Fue un aprendizaje profesional y personal']]},
  {t:'list', h:'Recomendaciones', items:[['a','Fortalecer la verificación: identidad, antecedentes y experiencia'],['b','Seguir probando con clientes potenciales'],['c','Mejorar seguridad, claridad de precios y atención de principio a fin'],['d','Marketing digital y campañas locales para captar usuarios y técnicos']]},
]},
{ id:'m17', n:17, title:'Puntos débiles: prepárate', tag:'Lo que el jurado puede notar', mins:6, you:true, cards:[
  {t:'warn', h:'1 · Dos versiones del MoSCoW', p:'El tablero MoSCoW (pág. 45) pone HU06 y HU13 en "Debe tener", HU02, HU11 y HU12 en "Debería" y HU07 en "Podría", pero el backlog priorizado (pág. 46) y la PPT los ordenan distinto. Defensa: "El tablero fue la primera priorización; el backlog de la pág. 46 es la versión final con la que armamos los sprints."'},
  {t:'warn', h:'2 · 200 usuarios vs. 72,000 clientes', p:'El Scope Canvas dice 200 usuarios en 3 meses, pero el RSI asume 72,000 en el año. Defensa: "Las metas del Scope son de validación inicial; el RSI sigue el método del curso. Por eso calculamos el equilibrio: 1,350 clientes."'},
  {t:'warn', h:'3 · ¿App móvil o web?', p:'La misión y el Lean Canvas dicen "aplicación móvil", pero el MVP es web. Defensa: "Empezamos con una plataforma web adaptable al celular, que es más barata y rápida de validar; la app nativa es el siguiente paso."'},
  {t:'warn', h:'4 · FODA con fortalezas del usuario', p:'Las fortalezas del FODA describen hábitos del usuario, no de la empresa. Si lo preguntan: "Lo construimos desde el comportamiento del cliente para encontrar oportunidades; como empresa, nuestras fortalezas son la verificación y el enfoque en Lima Norte."'},
  {t:'warn', h:'5 · Detalles de forma', p:'La portada de la PPT dice "PAT 2024" y en la tesis aparece "Mendoza James" (es Jaimes). Corrígelos antes del 23 si aún se puede.'},
]},
];

const JURY = [
 {m:'m1',q:'Explíquenos su proyecto en un minuto.',a:'ServiGo es una plataforma digital que conecta a hogares y pequeños negocios de Lima Norte con técnicos verificados. El problema que encontramos no es encontrar un número, sino encontrar a alguien en quien confiar. Por eso mostramos perfiles verificados por DNI y antecedentes, calificaciones reales y precios referenciales antes de contratar, con garantía y libro de reclamaciones. ServiGo: encuentra, compara y contrata al técnico que necesitas, con rapidez y confianza.'},
 {m:'m1',q:'¿Por qué eligieron Lima Norte?',a:'Es la zona más poblada de Lima según IPSOS, con alta demanda de servicios técnicos, y es donde hicimos las entrevistas. Empezar enfocados nos permite verificar bien a los técnicos antes de crecer.'},
 {m:'m1',q:'¿Qué metodologías usaron y para qué?',a:'Design Thinking para entender al usuario: entrevistas, protopersona, mapa de empatía, Customer Journey y Validation Board. Y Scrum para construir: backlog, MoSCoW, Planning Poker, sprints, daily, review y retrospectivas.'},
 {m:'m2',q:'¿Cuál fue tu rol y qué hiciste?',a:'Fui el Scrum Master. Coordiné la organización del equipo, facilité las reuniones y registré los impedimentos con su solución. Por ejemplo, cuando teníamos problemas de comunicación y horarios, formalizamos los canales y llevamos actas de reunión.'},
 {m:'m2',q:'¿Cuál es la diferencia entre Product Owner y Scrum Master?',a:'La Product Owner decide qué se construye y en qué orden, prioriza el backlog. El Scrum Master cuida cómo trabaja el equipo: que siga Scrum y que nada lo bloquee.'},
 {m:'m3',q:'¿Quién es su cliente?',a:'Pedro López: 40 años, comerciante de Comas, con poco tiempo. Usa apps para pedir servicios y valora más la disponibilidad inmediata que el precio. Su mayor miedo es dejar entrar a un desconocido sin referencias.'},
 {m:'m4',q:'¿Qué estudios realizaron para identificar las necesidades?',a:'Primero 24 entrevistas de exploración con una guía de 23 preguntas. Ordenamos los hallazgos con la protopersona, el mapa de empatía y el Customer Journey Map. Validamos hipótesis con el Validation Board, con un criterio de 65%. Y luego hicimos 11 entrevistas mostrando el prototipo.'},
 {m:'m4',q:'¿Qué fue lo más importante que descubrieron en las entrevistas?',a:'Que el problema es de confianza: creen que lo barato sale caro, mandan fotos por WhatsApp, comparan 2 o 3 técnicos y les cobran adicionales no pactados. Y nos pidieron validar DNI y antecedentes, y tener garantía.'},
 {m:'m4',q:'¿Cómo convirtieron los hallazgos en funciones?',a:'Cada hallazgo se volvió una historia de usuario. Si cobran adicionales, el botón de conformidad bloquea el precio. Si mandan fotos por WhatsApp, el chat permite fotos y videos. Si piden validar el DNI, existe el perfil verificado.'},
 {m:'m5',q:'¿Qué es un pivoteo? ¿Pivotearon?',a:'Es cambiar de rumbo cuando una hipótesis resulta falsa. Lo vimos en el Validation Board. No tuvimos que pivotear: la hipótesis de mayor riesgo, que el usuario valora la información verificada, superó el criterio del 65%.'},
 {m:'m6',q:'¿Cómo calcularon el tamaño del mercado?',a:'TAM: 10 millones en Lima por 60% que contrata servicios, 6 millones de personas, 900 millones de soles. SAM: 30% de Lima Norte por 80% con smartphone, 1.44 millones, 216 millones de soles. SOM: el 5%, 72,000 personas, 10.8 millones. Cada persona gasta S/ 150 al año.'},
 {m:'m6',q:'¿De dónde sacaron esos datos?',a:'La población, del INEI. El peso de Lima Norte, de IPSOS. El uso de celular e internet, del INEI. El 60%, el gasto de S/ 600 y el 5% son supuestos del equipo basados en las entrevistas.'},
 {m:'m7',q:'¿Quiénes son su competencia y en qué se diferencian?',a:'Facebook Marketplace, Helpers y el boca a boca. Ninguno verifica al técnico, muestra tarifas antes de contratar, da garantía y se enfoca en Lima Norte al mismo tiempo. ServiGo junta todo eso.'},
 {m:'m8',q:'¿Cómo gana dinero ServiGo?',a:'Con una comisión del 10% por cada servicio contratado. Para el cliente, registrarse es gratis. A futuro, el Lean Canvas plantea una suscripción premium para técnicos y un cobro por emergencias nocturnas.'},
 {m:'m8',q:'¿Qué muestra su Customer Journey Map?',a:'El recorrido actual: la necesidad y recibir el servicio son positivos, pero buscar, comparar, coordinar, calificar y recomendar son negativos. En cada etapa negativa propusimos una solución: búsqueda por zona, precios cotizados, contacto directo y calificaciones con reputación pública.'},
 {m:'m9',q:'¿Cuál es su propuesta de valor?',a:'Conexión inmediata, rápida y segura con técnicos verificados de Lima Norte, con precios transparentes y garantía, desde el celular. Cada dolor tiene un aliviador: perfil verificado, reseñas reales, horarios y tabla de precios.'},
 {m:'m9',q:'¿En qué consistió la dinámica Walt Disney?',a:'Analizamos la idea desde tres roles. El soñador propuso sin límites: técnicos 24 horas, seguimiento, pagos en la app. El realista vio cómo hacerlo posible. Y el crítico detectó riesgos: datos personales, técnicos que no cumplen y precios que cambian.'},
 {m:'m10',q:'¿Cómo validaron el prototipo?',a:'Con 11 entrevistas y una guía de 9 preguntas. La mayoría lo vio útil para emergencias. De ahí salieron dos ideas: la de María Fernanda, que reforzó la solicitud de emergencia, y la de Israel, un asistente virtual que quedó como HU14 para un siguiente lanzamiento.'},
 {m:'m10',q:'¿Cuáles son sus metas a corto plazo?',a:'Según el Scope Canvas: 200 usuarios activos y 30 servicios en 3 meses, 80 técnicos verificados en el primer trimestre y 50 transacciones pagadas en 4 meses, con 40% de retención de usuarios y 60% de técnicos.'},
 {m:'m11',q:'¿Qué es MoSCoW y cómo priorizaron?',a:'Es una técnica de priorización: Must, Should, Could y Won\'t. Primero pusimos lo que da confianza: plataforma, perfil, verificación, tarifas, conformidad y reclamos. Luego la comunicación y la garantía, y al final la rapidez: geolocalización, rastreo y emergencia.'},
 {m:'m11',q:'¿Por qué la emergencia quedó como Could si es lo más innovador?',a:'Porque sin confianza nadie contrata, aunque el técnico esté cerca. Primero aseguramos la base de confianza en los Sprints 1 y 2, y la rapidez llegó en el Sprint 3.'},
 {m:'m11',q:'¿Qué diferencia hay entre Definición de Listo y Definición de Hecho?',a:'La Definición de Listo es lo que debe estar claro antes de empezar una historia, como el diseño aprobado. La de Hecho es lo que debe estar construido para darla por terminada. Y los criterios de aceptación son las pruebas medibles, como que el DNI tenga 8 dígitos.'},
 {m:'m12',q:'¿Cómo organizaron los sprints?',a:'Cuatro sprints. El Sprint 0 de revisión, del 5 al 11 de octubre. El Sprint 1, la base para encontrar técnicos confiables. El Sprint 2, contratar de forma segura. El Sprint 3, rapidez y emergencia. El lanzamiento Alpha fue el 8 de noviembre.'},
 {m:'m12',q:'¿Qué es el Planning Poker? Dé un ejemplo.',a:'Cada uno estima en secreto el esfuerzo de una historia con Fibonacci. Si no coinciden, se conversa y se vuelve a votar. En el chat, Dulce votó 5 y los demás 8; quedó en 8 porque incluye fotos y videos.'},
 {m:'m13',q:'¿Qué impedimentos tuvieron y cómo los resolvieron?',a:'Tres. Falta de comunicación y horarios: formalizamos canales y actas. Validación de documentos lenta: la hicimos por etapas. Y uno externo, el retraso del servicio de mapas: probamos con datos simulados para no detenernos.'},
 {m:'m13',q:'¿Hubo solicitudes de cambio?',a:'Sí. Un stakeholder pidió reducir las categorías del inicio. No se aprobó, porque la validación de la HU03 mostró que los usuarios estaban conformes y el cambio no agregaba valor.'},
 {m:'m13',q:'¿Qué aprendieron en las retrospectivas?',a:'En el Sprint 1, que debíamos revisar los criterios de aceptación antes de programar; agregamos reuniones a mitad de semana. En el Sprint 2, ajustar los tiempos de prueba con una mini revisión de calidad. En el Sprint 3, no acumular entregables al final.'},
 {m:'m14',q:'¿Qué funcionalidades consideran más innovadoras?',a:'Tres. La solicitud de emergencia en 2 pasos, donde los técnicos cercanos envían su precio. El precio bloqueado con garantía de 7 días. Y la verificación de DNI y antecedentes antes de aparecer, con el check azul.'},
 {m:'m14',q:'¿Lograron Product Market Fit?',a:'Todavía no está comprobado. Hay señales positivas en las entrevistas, pero para confirmarlo necesitamos usuarios activos, contrataciones reales, satisfacción y retención.'},
 {m:'m14',q:'¿Es escalable y replicable?',a:'Es replicable porque puede llevarse a otros distritos o ciudades sumando técnicos. Y es escalable porque, al ser digital, crece en usuarios sin necesitar un local en cada zona.'},
 {m:'m15',q:'¿Cómo calcularon el RSI?',a:'Con el método del curso, en un año. LTV: S/ 85 por 10% por 3 servicios, S/ 25.50. CAC promedio: S/ 8.32. Ingresos: S/ 17.18 por 72,000 clientes, S/ 1,236,830. Costos: S/ 23,183. RSI: 5,235%.'},
 {m:'m15',q:'Su RSI de 5,235% no es creíble. ¿Por qué deberíamos creerlo?',a:'Sale alto porque asumimos captar todo el SOM en el primer año y la inversión es baja al ser digital. Por eso calculamos un escenario pesimista: con el 10% del SOM el RSI sigue en 433%, y el punto de equilibrio es de solo 1,350 clientes. Además, el LTV es 3 veces el CAC.'},
 {m:'m15',q:'¿Por qué una comisión de 10%?',a:'Es baja a propósito, para atraer técnicos informales que hoy no pagan nada. Workana cobra 10%. Si fuera más alta, el técnico preferiría arreglar por fuera de la app.'},
 {m:'m15',q:'¿Qué pasa si el técnico cobra por fuera para no pagar comisión?',a:'Fuera de la app pierde la garantía, las reseñas que le traen clientes y el check de verificado. Para él, la comisión es el precio de conseguir clientes sin buscarlos.'},
 {m:'m15',q:'¿S/ 13,500 alcanza para desarrollar la app?',a:'Es un desarrollador junior por 3 meses a S/ 4,500, apoyado con IA, que acelera el trabajo. Además usamos servicios que se pagan por uso, como Supabase y Google Maps.'},
 {m:'m16',q:'¿Cuál es su principal conclusión?',a:'Que el problema central al contratar técnicos es la falta de confianza, información y transparencia. Design Thinking nos ayudó a convertirlo en una solución centrada en el usuario, y Scrum a construirla de forma organizada.'},
 {m:'m16',q:'¿Qué recomiendan para el futuro?',a:'Fortalecer la verificación de técnicos, seguir probando con clientes reales, mejorar la claridad de precios y la atención, y hacer marketing digital y campañas locales para sumar usuarios y técnicos.'},
 {m:'m17',q:'¿Por qué dicen "aplicación móvil" si el MVP es web?',a:'Empezamos con una plataforma web adaptable al celular porque es más rápida y barata de validar. La app nativa es el siguiente paso cuando confirmemos la demanda.'},
 {m:'m17',q:'En el Scope dicen 200 usuarios, pero en el RSI 72,000. ¿Cuál es?',a:'Son cosas distintas. Los 200 usuarios son la meta de validación de los primeros 3 meses. El RSI sigue el método del curso con el SOM completo. Lo realista es mirar el punto de equilibrio: con 1,350 clientes ya recuperamos la inversión.'},
];

 'Retrospectiva':'Reunión al final de cada sprint donde el equipo revisa cómo trabajó: qué salió bien, qué se pudo hacer mejor y qué acciones tomará. En ServiGo, en el Sprint 1 acordaron revisar los criterios de aceptación antes de programar y hacer reuniones a mitad de semana.',
 'Sprint':'Un periodo corto de trabajo (en ServiGo, unos 9 días) en el que se termina una parte del producto. Tuvieron 4: Sprint 0 de revisión y Sprints 1, 2 y 3.',
 'Sprint Review':'La reunión al final del sprint donde se MUESTRA lo construido y se revisa si cada historia cumple sus criterios (aceptada o no). En ServiGo se mostró el tablero Kanban en "Hecho".',
 'Daily Standup':'Reunión diaria corta (unos 15 minutos) donde cada uno dice qué hizo, qué hará y qué lo bloquea. Ahí el Scrum Master detecta impedimentos.',
 'Impedimento':'Cualquier obstáculo que frena al equipo. En ServiGo: falta de comunicación, validación de documentos lenta y el retraso del servicio de mapas.',

 'Historia de usuario':'Un requisito escrito desde el usuario: COMO (quién), QUIERO (qué), PARA (por qué). Ej.: Como usuario que prioriza su seguridad, quiero ver perfiles verificados, para confiar en el técnico.',
 'Product Owner':'La persona que decide QUÉ se construye y en qué orden: dueña de la visión y del backlog. En ServiGo es Dulce.',

 'Business Owner':'Representa al negocio: identifica necesidades y revisa que las funciones generen valor. En ServiGo es Angel.',
 'Scrum':'Marco de trabajo ágil para construir un producto por partes, en sprints cortos, con roles (PO, SM, equipo) y reuniones (planning, daily, review, retro).',
 'Design Thinking':'Método para resolver problemas empezando por entender a las personas: empatizar, definir, idear, prototipar y validar. En ServiGo: entrevistas, protopersona, mapa de empatía, Validation Board y prototipo.',

  if(useSupa()){ try{ const ex=await rpc('se_status',{p_who:who}); return ex? {remote:true}: null; }catch(e){ S.offline=true; } }
  const l=lsGet(KEY+'-acc-'+who); return l? JSON.parse(l): null; }
async function setAccount(who,h){ const v={h,created:Date.now()};
  if(CAP.db){ await CAP.db.doc('accounts/'+who).set(v); }
  else if(useSupa()){ const ok=await rpc('se_register',{p_who:who,p_hash:h}); if(!ok) throw new Error('exists'); }
  lsSet(KEY+'-acc-'+who,JSON.stringify(v)); }
function todayStr(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function markDay(){const t=todayStr(); if(!P.days.includes(t)){P.days.push(t); save();}}
function streak(){let n=0; const d=new Date(); for(;;){ if(P.days.includes(todayStr(d))){n++; d.setDate(d.getDate()-1);} else break;} return n;}
const ROLE=()=>ROLES[WHO]||ROLES.andre;
function p13n(t){ if(WHO!=='angel') return t; return String(t).replace(/Andre Sebastian Arce Vargas/g,'Angel Sebastian Mario Astudillo Porroa').replace('mi rol Scrum es Scrum Master: coordiné al equipo y gestioné los impedimentos','mi rol Scrum es Business Owner: identifiqué las necesidades de los usuarios y revisé que las funciones sirvan al negocio').replace('mi rol Scrum es Scrum Master.','mi rol Scrum es Business Owner.'); }
function getJ(qi){ const q=JURY[qi]; const alt=(JURY_ALT[qi]||{})[WHO]; return {m:q.m, q:q.q, a: p13n(alt?alt.a:q.a), k: alt?alt.k:JKEYS[qi]}; }
// ---------- speech ----------
const TTS = {ok:'speechSynthesis' in window, voice:null, queue:[], on:false, cb:null, tok:0};
function pickVoice(){ if(!TTS.ok) return; const vs=speechSynthesis.getVoices(); const es=vs.filter(v=>/^es/i.test(v.lang));
  const pref=['es-PE','es-US','es-419','es-MX','es-CO','es-AR','es-ES'];
  TTS.voice = pref.map(p=>es.find(v=>v.lang.replace('_','-')===p && /google|natural|neural|premium|enhanced/i.test(v.name))||es.find(v=>v.lang.replace('_','-')===p)).find(Boolean) || es[0] || null; }
if(TTS.ok){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
TTS.tok=0;
function stopSpeak(){ TTS.tok++; TTS.queue=[]; TTS.on=false; TTS.cb=null; if(TTS.ok) speechSynthesis.cancel(); if(CAP.tts&&CAP.tts.active&&CAP.tts.active()) CAP.tts.stop().catch(()=>{}); }
function finish(tok){ if(tok!==TTS.tok) return; TTS.on=false; const c=TTS.cb; TTS.cb=null; if(c) c(); }
function speak(text,cb){ stopSpeak(); const tok=TTS.tok; TTS.on=true; TTS.cb=cb||null; const clean=norm(text).replace(/\s+/g,' ').trim();
  if(CAP.tts){ const parts=[]; let cur=''; clean.split(/(?<=[.!?;:])\s+/).forEach(x=>{ if((cur+' '+x).length>1500){parts.push(cur);cur=x;} else cur=cur?cur+' '+x:x; }); if(cur) parts.push(cur);
    let chain=Promise.resolve(); parts.forEach(pt=>{ chain=chain.then(()=>{ if(tok!==TTS.tok) throw {code:'stopped'}; return CAP.tts.speak(pt,{rate:P.rate||1,language:'es'}); }); });
    chain.then(()=>finish(tok)).catch(e=>{ if(tok!==TTS.tok) return; if(e&&(e.code==='stopped')){ TTS.on=false; render(); return; } browserSpeak(clean,tok); });
    return; }
  browserSpeak(clean,tok); }
function browserSpeak(clean,tok){ if(!TTS.ok){ TTS.on=false; toast('Tu navegador no tiene voz. Prueba con Chrome o Safari.'); return; }
  TTS.queue=clean.split(/(?<=[.!?;:])\s+/).filter(x=>x.trim()); const step=()=>{ if(tok!==TTS.tok) return; const x=TTS.queue.shift(); if(!x){ finish(tok); return; }
    const u=new SpeechSynthesisUtterance(x); u.lang=(TTS.voice&&TTS.voice.lang)||'es-PE'; if(TTS.voice) u.voice=TTS.voice; u.rate=P.rate||1; u.onend=step; u.onerror=step; speechSynthesis.speak(u); }; step(); }

let DICT={target:null,on:false};
function setupDict(){ const d=CAP.dict; if(!d) return;
  d.onFinal(({text})=>{ const el=document.getElementById(DICT.target); if(!el) return; el.value=(el.value?el.value.replace(/\s*$/,' '):'')+text; el.dispatchEvent(new Event('input',{bubbles:true})); });
  d.onState(({state})=>{ DICT.on=(state==='listening'||state==='starting'); document.querySelectorAll('.mic').forEach(b=>{b.classList.toggle('live',DICT.on); b.setAttribute('aria-label',DICT.on?'Detener dictado':'Dictar con el micrófono');}); }); }

function toast(t){const el=$('#toast'); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2600);}
function shuffle(a){a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a;}
function plain(s){return String(s).replace(/<[^>]+>/g,'');}
function modById(id){return MODULES.find(m=>m.id===id);}
function huSay(){return 'Estas son las 13 historias de usuario. '+HU_LIST.map(h=>h[0].replace('HU0','historia ').replace('HU1','historia 1')+', '+h[1]+', '+({Must:'debe tener',Should:'debería tener',Could:'podría tener'}[h[2]])+', '+h[3]+' puntos').join('. ')+'.';}
function cardSay(c){ if(c.say) return c.say; if(c.t==='hu') return huSay();
  let s=[]; if(c.eyebrow) s.push(c.eyebrow+'.'); if(c.h) s.push(c.h+'.'); if(c.n) s.push(c.n+' '+(c.l||'')+'.'); if(c.q) s.push(c.q); if(c.p) s.push(c.p); if(c.by) s.push(c.by);
  if(c.items) c.items.forEach(it=>{ if(Array.isArray(it)) s.push(/^[0-9a-d]$/.test(String(it[0]))? it[1]+'.' : it[0]+': '+it[1]+'.'); else s.push(it+'.'); });
  if(c.steps) c.steps.forEach(it=>s.push(it[0]+'. '+it[1]+'.'));
  if(c.cells) c.cells.forEach(it=>s.push(it[0]+': '+it[1].join(', ')+'.'));
  if(c.key) s.push('Para recordar: '+c.key+'.');
  return s.join(' ');
}
function norm(t){ return String(t)
  .replace(/S\/ ?(\d+(?:[.,]\d+)*)/g,'$1 soles').replace(/US\$ ?(\d+(?:[.,]\d+)*)/g,'$1 dólares')
  .replace(/(\d),(?=\d{3}\b)/g,'$1').replace(/(\d),(?=\d{3}\b)/g,'$1')
  .replace(/(\d+)\.(\d{2})\b/g,'$1 con $2').replace(/(\d+)\.(\d)\b/g,'$1 coma $2')
  .replace(/\bHU0?(\d+)/g,'historia $1').replace(/\bTA0?(\d+)/g,'tarea $1').replace(/\bS([0-3])\b/g,'Sprint $1')
  .replace(/·/g,',').replace(/→/g,', entonces, ').replace(/−/g,' menos ').replace(/×/g,' por ').replace(/÷/g,' entre ').replace(/≈/g,' aproximadamente ').replace(/\//g,' ').replace(/"/g,''); }

function juryDeck(f){ let d=JURY.map((q,i)=>i);
  if(f==='weak') d=d.filter(i=>(P.jury[i]??-1)<2);
  else if(f && f.startsWith('m')) d=d.filter(i=>JURY[i].m===f);
  else if(f==='done') d=d.filter(i=>P.done[JURY[i].m]);
  // las que no sabes salen primero
  return shuffle(d).sort((a,b)=>(P.jury[a]??-1)-(P.jury[b]??-1)); }

CONTEXTO DEL PROYECTO SERVIGO:
${projectCtx()}

PREGUNTA DE ${ROLE().name.toUpperCase()}: ${q}`;
  try{ const r=await CAP.sample(prompt,{signal:aiCtl.signal,cache:true,onText:({text})=>{ S.ai=text; const el=document.querySelector('.aitext'); if(el&&S.view==='ask') el.innerHTML=fmtAns(text); }});
    S.ai=r.text; S.aiDone=true; P.asks=[{q,a:r.text,t:Date.now()}].concat((P.asks||[]).filter(x=>x.q!==q)).slice(0,20); save(); if(S.view==='ask') render(); }
  catch(e){ if(e&&e.code==='cancelled') return; S.ai = e&&e.code==='rate_limited'? 'Hiciste muchas preguntas seguidas. Espera un minuto e inténtalo otra vez.' : 'No pude responder ahora. Revisa el glosario o inténtalo de nuevo.'; S.aiDone=false; if(S.view==='ask') render(); } }
function submitAsk(q){ q=(q||'').trim(); if(!q) return; S.q=q; S.gloss=findGloss(q); S.ai=null; S.aiDone=false; render();
  const exact = S.gloss && nrm(q).replace(/[¿?]/g,'').trim().length <= nrm(S.gloss).length+22;
  if(!S.gloss || !exact) askAI(q); }
function playCard(){ const m=modById(S.m); const c=m.cards[S.i];
  speak(p13n(cardSay(c)), ()=>{ if(S.view==='mod' && S.listen){ setTimeout(()=>{ if(!S.listen||S.view!=='mod') return; advance(true); },700);} else render(); }); render(); }
function advance(auto){ const m=modById(S.m);
  if(S.i<m.cards.length-1){ S.i++; render(); window.scrollTo(0,0); if(auto) playCard(); }
  else if(auto){ const nx=MODULES[MODULES.indexOf(m)+1]; if(nx){ S.m=nx.id; S.i=0; render(); speak('Módulo '+nx.n+'. '+nx.title+'.',()=>playCard()); } else { S.listen=false; render(); toast('Terminaste todo el proyecto. ¡Bien!'); } }
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'); if(!b) return; const a=b.dataset.a; if(WHO) markDay();
  if(a==='home') go({view:'home'});
  else if(a==='pickwho') pickWho(b.dataset.w);
  else if(a==='install'){ if(deferredPrompt){ deferredPrompt.prompt(); deferredPrompt.userChoice.then(()=>{ deferredPrompt=null; render(); }); } }
  else if(a==='instx'){ lsSet(KEY+'-inst-x','1'); render(); }
  else if(a==='sim') go({view:'sim',phase:'intro'});
  else if(a==='simstart'){ stopSpeak(); S={view:'sim',phase:'q',qs:simPick(),i:0,ans:[],secs:[],txt:''}; simShowQ(); }
  else if(a==='simsay'){ if(TTS.on){stopSpeak();render();} else { speak(getJ(S.qs[S.i]).q,()=>render()); render(); } }
  else if(a==='simnext'||a==='simskip'){ const el=document.getElementById('sans'); S.ans[S.i]= a==='simskip'? '' : (el?el.value:''); S.secs[S.i]=Math.round((Date.now()-S.t0)/1000); stopSpeak();
     if(S.i<S.qs.length-1){ S.i++; simShowQ(); } else gradeSim(); }
  else if(a==='simexit'){ if(S.phase==='q' && !S.exitOk){ S.exitOk=true; toast('Toca otra vez para salir: perderás este simulacro.'); setTimeout(()=>{S.exitOk=false;},3000); return; } clearInterval(simTimer); go({view:'home'}); }
  else if(a==='unpick') go({view:'login'});
  else if(a==='logout'){ if(WHO) lsSet(KEY+'-h-'+WHO,''); WHO=null; HASH=null; lsSet(KEY+'-who',''); P=BLANK(); go({view:'login'}); }
  else if(a==='ask') go({view:'ask',q:'',gloss:null,ai:null,focus:'aq'});
  else if(a==='askchip'){ document.getElementById('aq')&&(document.getElementById('aq').value=b.dataset.t); submitAsk(b.dataset.t); window.scrollTo(0,0); }
  else if(a==='askmore') askAI(S.q);
  else if(a==='sayans'){ if(TTS.on){stopSpeak();render();} else speak(S.ai.replace(/\n/g,' '),()=>{}); }
  else if(a==='histq'){ const h=P.asks[+b.dataset.i]; S.q=h.q; S.gloss=findGloss(h.q); S.ai=h.a; S.aiDone=true; render(); window.scrollTo(0,0); }
  else if(a==='mic'){ const d=CAP.dict; if(!d) return; if(d.active()){ d.stop().catch(()=>{}); } else { DICT.target=b.dataset.t; d.start({language:'es'}).catch(err=>{ if(err&&err.code==='not_granted') toast('Sin permiso de micrófono: escribe tu respuesta.'); }); } }
  else if(a==='open') go({view:'mod',m:b.dataset.m,i:0,listen:false});
  else if(a==='listen'){ S={view:'mod',m:b.dataset.m,i:0,listen:true}; render(); playCard(); }
  else if(a==='startlisten'){ S.listen=true; playCard(); }
  else if(a==='stoplisten'){ S.listen=false; stopSpeak(); render(); }
  else if(a==='next'){ stopSpeak(); S.listen=false; advance(false); }
  else if(a==='prev'){ stopSpeak(); S.listen=false; if(S.i>0){S.i--; render();} }
  else if(a==='say'){ if(TTS.on){ stopSpeak(); S.listen=false; render(); } else { const c=modById(S.m).cards[S.i]; speak(cardSay(c),()=>render()); render(); } }
  else if(a==='rate'){ P.rate=parseFloat(b.dataset.r); save(); render(); toast('Velocidad '+P.rate+'x'); }
  else if(a==='quiz') go({view:'quiz',m:b.dataset.m,qi:0,pick:null,score:0});
  else if(a==='sayq'){ const q=QUIZ[S.m][S.qi]; if(q) speak(q.q+' Opciones: '+q.o.map((o,i)=>(i+1)+', '+o).join('. ')); }
  else if(a==='pick'){ const q=QUIZ[S.m][S.qi]; S.pick=+b.dataset.i; if(S.pick===q.a) S.score++; render(); }
  else if(a==='qnext'){ S.qi++; S.pick=null; if(S.qi>=QUIZ[S.m].length){ P.done[S.m]=true; P.quiz[S.m]=S.score; save(); } render(); window.scrollTo(0,0); }
  else if(a==='jury') go({view:'jury',f:b.dataset.f||'all',deck:juryDeck(b.dataset.f||'all'),j:0,rev:false,check:null,txt:''});
  else if(a==='reveal'){ S.rev=true; S.check=null; render(); }
  else if(a==='checkj'){ const t=(document.getElementById('jans')||{}).value||''; S.txt=t; if(t.trim().length<8){ toast('Escribe o dicta tu respuesta primero'); return; } S.check=checkAnswer(S.deck[S.j],t); S.rev=true; render(); }
  else if(a==='sayj'){ if(TTS.on){stopSpeak(); render(); return;} if(S.deck[S.j]==null) return; const q=getJ(S.deck[S.j]); speak(S.rev? 'Respuesta modelo. '+q.a : q.q, ()=>render()); render(); }
  else if(a==='rate-j'){ const qi=S.deck[S.j]; P.jury[qi]=+b.dataset.v; save(); stopSpeak(); S.j++; S.rev=false; S.check=null; S.txt=''; render(); window.scrollTo(0,0); }
  else if(a==='plan') go({view:'plan'});
});
document.addEventListener('input',e=>{ if(e.target.id==='jans'||e.target.id==='sans') S.txt=e.target.value; if(e.target.id==='aq') S.q=e.target.value; });
document.addEventListener('submit',e=>{ e.preventDefault(); if(e.target.id==='lf') doLogin(); if(e.target.id==='af') submitAsk((document.getElementById('aq')||{}).value); });
document.addEventListener('keydown',e=>{ if(S.view!=='mod') return; if(e.key==='ArrowRight'){stopSpeak();S.listen=false;advance(false);} if(e.key==='ArrowLeft'&&S.i>0){stopSpeak();S.listen=false;S.i--;render();} });
(async()=>{ const w=lsGet(KEY+'-who'); if(w && ROLES[w]){ WHO=w; HASH=lsGet(KEY+'-h-'+w)||null; const l=lsGet(KEY+'-'+w); if(l) try{P=Object.assign(BLANK(),JSON.parse(l));}catch(e){} S={view:'home'}; render(); await capsReady; await loadProgress(); if(S.view==='home') render(); } else { S={view:'login'}; render(); } })();
</script>
